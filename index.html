<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0b1738"><title>CNH CHECKER — DETRAN-MT</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#17233a}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:240px;background:#0b1738;color:#dbe6ff;padding:22px 14px;position:fixed;left:0;top:0;bottom:0}.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 28px}.brand-icon{width:38px;height:38px;border-radius:11px;background:#1d5fbd;display:grid;place-items:center;color:#fff;font-weight:800}.brand b{display:block;color:#fff;font-size:14px}.brand small{color:#91a5d3;font-size:10px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:12px;border-radius:9px;background:transparent;color:#aebddd;text-align:left;font-weight:600;font-size:13px}.nav button:hover,.nav button.active{background:#19458f;color:#fff}.side-bottom{position:absolute;bottom:18px;left:24px;font-size:11px;color:#8194bd}.dot{display:inline-block;width:7px;height:7px;background:#35c878;border-radius:50%;margin-right:6px}main{margin-left:240px;width:calc(100% - 240px);padding:28px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{margin:0;font-size:27px}.top p{margin:5px 0 0;color:#758299;font-size:13px}.top-actions{display:flex;align-items:center;gap:9px}.system{background:#fff;border:1px solid #e1e7ef;padding:8px 11px;border-radius:99px;font-size:11px;color:#58677e}.system i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2bc370;margin-right:6px}.icon{width:38px;height:38px;border:1px solid #e1e7ef;background:#fff;border-radius:9px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:18px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:14px;padding:16px;display:flex;gap:11px;align-items:center;box-shadow:0 5px 18px #10264d0b}.card-icon{width:39px;height:39px;border-radius:10px;display:grid;place-items:center;background:#eaf2ff;color:#2362b5;font-size:19px}.card span{display:block;color:#778398;font-size:10px}.card b{display:block;font-size:21px;margin-top:3px}.card small{color:#9aa5b5;font-size:9px}.panel{background:#fff;border:1px solid #e5eaf1;border-radius:15px;padding:20px;margin-bottom:18px;box-shadow:0 5px 18px #10264d0b}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.panel h2{margin:0;font-size:17px}.panel p{margin:5px 0;color:#778398;font-size:12px}.progress{height:13px;background:#e8edf4;border-radius:99px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#1854ad,#4290ec);border-radius:99px}.progress-row{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:#69778c}.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:19px 0}.mini div{background:#f7f9fc;border-radius:9px;padding:10px}.mini span{display:block;font-size:10px;color:#7d899b}.mini b{font-size:16px}.green{color:#14925a!important}.yellow{color:#a77700!important}.red{color:#c84040!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:9px;background:#edf1f6;color:#35435a;font-size:12px;font-weight:700}.btn.primary{background:#17458f;color:#fff}.btn.success{background:#e7f8ef;color:#138b54}.btn.warning{background:#fff6d9;color:#9a7000}.btn.danger{background:#fff0f0;color:#c23f3f}.btn:disabled{opacity:.5;cursor:not-allowed}.badge{display:inline-block;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:800}.success{background:#e7f8ef;color:#138b54}.attention{background:#fff6d9;color:#9a7000}.error{background:#fff0f0;color:#c53d3d}.pending{background:#edf0f4;color:#657184}.processing{background:#e8f1ff;color:#1e5eb6}.table-wrap{overflow:auto;border:1px solid #e6ebf1;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:11px 12px;border-bottom:1px solid #edf0f4;text-align:left;font-size:11px;white-space:nowrap}th{background:#fafbfc;color:#78859a;text-transform:uppercase;font-size:9px;letter-spacing:.5px}td{color:#526077}.view{background:#edf3fc;color:#1e579f;border-radius:7px;padding:6px 9px;font-size:10px;font-weight:700}.toolbar{display:flex;gap:9px;margin-bottom:15px}.search{background:#fff;border:1px solid #e1e6ee;border-radius:9px;height:40px;display:flex;align-items:center;padding:0 12px;flex:1;max-width:520px}.search input{border:0;outline:0;width:100%;font-size:12px}.select{height:40px;border:1px solid #e1e6ee;border-radius:9px;background:#fff;padding:0 11px;color:#59677d}.process-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.eyebrow{font-size:9px;font-weight:800;letter-spacing:1px;color:#8190a6}.current h2{font-size:24px}.fields{display:flex;gap:30px;margin-top:15px}.fields span{font-size:11px;color:#7a8798}.fields b{display:block;color:#2c3c53;margin-top:4px}.det-card{background:linear-gradient(135deg,#f7fbff,#eef5ff);border:1px solid #dce9f8;border-radius:13px;padding:16px;margin-top:18px}.det-card h3{margin:0 0 7px;font-size:15px}.copy-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.copy-chip{background:#fff;border:1px solid #dfe7f2;border-radius:8px;padding:9px 11px;font-size:11px;color:#40516b}.copy-chip b{color:#17233a}.hint{margin-top:12px;padding:11px;border-radius:9px;background:#fff7e8;color:#8b6100;font-size:11px}.result-buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}.result-buttons button{min-height:48px}.empty{padding:35px;text-align:center;color:#778398}.modal-bg{position:fixed;inset:0;background:#061126aa;backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:16px;padding:22px;width:min(650px,100%);box-shadow:0 25px 70px #0004}.modal-head{display:flex;justify-content:space-between}.modal-head h2{margin:0}.close{background:#eef1f5;width:34px;height:34px;border-radius:8px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.details div{background:#f7f9fc;padding:11px;border-radius:9px}.details span{display:block;font-size:9px;color:#7b8799}.details b{display:block;font-size:12px;margin-top:4px}.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#08132f,#123e7f);display:grid;place-items:center;padding:20px;z-index:9999}.login-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 25px 80px #0005}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.login-brand-icon{width:46px;height:46px;border-radius:13px;background:#1d5fbd;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}.login-brand b{display:block;font-size:17px}.login-brand small{color:#71809a}.login-card h1{margin:0 0 7px;font-size:23px}.login-card p{color:#778398;font-size:13px}.login-field{margin-top:16px}.login-field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.login-field input{width:100%;height:44px;border:1px solid #dfe5ed;border-radius:9px;padding:0 12px;outline:0}.login-btn{width:100%;height:44px;margin-top:20px;border-radius:9px;background:#17458f;color:#fff;font-weight:800}.login-message{margin-top:13px;padding:11px;border-radius:9px;font-size:12px;display:none}.login-message.error{display:block;background:#fff0f0;color:#b93636}.login-message.info{display:block;background:#eef6ff;color:#205b9e}.toast{position:fixed;right:20px;bottom:20px;background:#12213e;color:#fff;padding:12px 15px;border-radius:10px;font-size:12px;z-index:50;box-shadow:0 10px 30px #0003}.toast.error{background:#a62d2d}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.sidebar{width:70px}.sidebar .brand div:last-child,.nav button span,.side-bottom{display:none}.nav button{justify-content:center}.brand{justify-content:center}.sidebar{padding:15px 8px}main{margin-left:70px;width:calc(100% - 70px);padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.process-grid{grid-template-columns:1fr}}@media(max-width:550px){.cards{grid-template-columns:1fr}.top{align-items:flex-start}.system{display:none}.mini{grid-template-columns:1fr 1fr}.toolbar{flex-direction:column}.search{max-width:none}.details{grid-template-columns:1fr}.result-buttons{grid-template-columns:1fr}}
</style></head><body>
<div class="login-overlay" id="loginOverlay"><div class="login-card"><div class="login-brand"><div class="login-brand-icon">✓</div><div><b>CNH CHECKER</b><small>DETRAN-MT</small></div></div><h1>Acesso restrito</h1><p>Entre com seu usuário para acessar o sistema.</p><form id="loginForm"><div class="login-field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username" required placeholder="seu@email.com"></div><div class="login-field"><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••"></div><button class="login-btn" type="submit">Entrar</button></form><div id="loginMessage" class="login-message"></div><p style="text-align:center;font-size:10px;margin-top:18px">Acesso protegido por Supabase Auth</p></div></div>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">✓</div><div><b>CNH CHECKER</b><small>DETRAN-MT</small></div></div><div class="nav" id="nav"><button class="active" data-page="dashboard">▦ <span>Dashboard</span></button><button data-page="motoristas">♙ <span>Motoristas</span></button><button data-page="processamento">◉ <span>Processamento</span></button></div><div class="side-bottom"><span class="dot"></span>Sistema local</div></aside><main id="main"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://antkqvrbcebqucqdkmau.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Xc2Y7koEBU-BCGwsgMPDiw_ObyBXQ-I";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const DETRAN_URL="https://internet.detrannet.mt.gov.br/habilitacao/ConsultaProcesso.asp";
const loginOverlay=document.getElementById('loginOverlay'),loginForm=document.getElementById('loginForm'),loginMessage=document.getElementById('loginMessage'),main=document.getElementById('main');
let page='dashboard',drivers=[],selected=null,query='',filter='TODOS',loading=false;
function msg(t,error=false){const e=document.createElement('div');e.className='toast'+(error?' error':'');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function setLogin(t,type='info'){loginMessage.textContent=t;loginMessage.className='login-message '+type}
function showSystem(){loginOverlay.style.display='none'} function showLogin(){loginOverlay.style.display='grid'}
async function initAuth(){const {data,error}=await supabaseClient.auth.getSession();if(error){setLogin('Erro ao verificar sessão.','error');return}if(data.session)showSystem();else showLogin();supabaseClient.auth.onAuthStateChange((_e,s)=>s?showSystem():showLogin())}
loginForm.addEventListener('submit',async e=>{e.preventDefault();setLogin('Entrando...','info');const {error}=await supabaseClient.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(error){setLogin('E-mail ou senha inválidos.','error');return}showSystem();await loadDrivers();render()});
async function logout(){await supabaseClient.auth.signOut();showLogin()}
function maskCPF(cpf){const s=String(cpf||'').replace(/\D/g,'');return s.length>=11?s.slice(0,3)+'.***.***-'+s.slice(-2):s||'—'}
function fullCPF(cpf){const s=String(cpf||'').replace(/\D/g,'');return s.length===11?s.slice(0,3)+'.'+s.slice(3,6)+'.'+s.slice(6,9)+'-'+s.slice(9):String(cpf||'—')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function statusKey(s){return String(s||'pendente').toLowerCase()}
function badge(s){const k=statusKey(s),map={sucesso:['success','Sucesso'],atencao:['attention','Atenção'],erro:['error','Erro'],pendente:['pending','Pendente'],processando:['processing','Processando']};const [c,l]=map[k]||map.pendente;return `<span class="badge ${c}">${l}</span>`}
function header(title,sub){return `<div class="top"><div><h1>${title}</h1><p>${sub}</p></div><div class="top-actions"><span class="system"><i></i>Supabase conectado</span><button class="icon" onclick="logout()" title="Sair">↪</button></div></div>`}
async function loadDrivers(){loading=true;const {data,error}=await supabaseClient.from('motoristas').select('*').order('criado_em',{ascending:true});loading=false;if(error){msg('Não foi possível carregar os motoristas.',true);console.error(error);return}drivers=data||[]}
function counts(){const c={total:drivers.length,pend:0,proc:0,suc:0,att:0,err:0};drivers.forEach(d=>{const s=statusKey(d.status);if(s==='pendente')c.pend++;else if(s==='processando')c.proc++;else if(s==='sucesso')c.suc++;else if(s==='atencao')c.att++;else if(s==='erro')c.err++});c.done=c.suc+c.att+c.err;return c}
function card(icon,title,val,small,tone=''){return `<div class="card"><div class="card-icon ${tone}">${icon}</div><div><span>${title}</span><b>${val}</b><small>${small}</small></div></div>`}
function stats(){const c=counts();return `<div class="cards">${card('◉','Total de motoristas',c.total,'Base atual')}${card('✓','Sucesso',c.suc,'Consultas concluídas','')}${card('!','Atenção',c.att,'Revisão manual','yellow')}${card('×','Erros',c.err,'Necessitam revisão','red')}${card('◷','Pendentes',c.pend,'Aguardando consulta')}</div>`}
function progress(){const c=counts(),pct=c.total?Math.round(c.done/c.total*100):0;return `<div class="panel"><div class="panel-head"><div><h2>Processamento assistido</h2><p>O sistema organiza a fila; a consulta é feita no portal oficial do DETRAN.</p></div>${badge(c.pend?'pendente':'sucesso')}</div><div class="progress"><div style="width:${pct}%"></div></div><div class="progress-row"><b>${c.done} / ${c.total}</b><span>${pct}%</span></div><div class="mini"><div><span>Concluídos</span><b>${c.done}</b></div><div><span>Sucesso</span><b class="green">${c.suc}</b></div><div><span>Atenção</span><b class="yellow">${c.att}</b></div><div><span>Pendentes</span><b>${c.pend}</b></div></div><div class="actions"><button class="btn primary" onclick="page='processamento';render()">◉ Ir para processamento</button></div></div>`}
function table(data){return `<div class="table-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>RENACH</th><th>Status</th><th>Resultado</th><th>Consulta</th><th>Ações</th></tr></thead><tbody>${data.map(d=>`<tr><td><b>${esc(d.nome)}</b></td><td>${maskCPF(d.cpf)}</td><td>${esc(d.renach||'—')}</td><td>${badge(d.status)}</td><td>${esc(d.resultado||'—')}</td><td>${d.data_consulta?new Date(d.data_consulta).toLocaleString('pt-BR'):'—'}</td><td><button class="view" onclick="openDetails('${d.id}')">Ver detalhes</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">Nenhum motorista encontrado.</td></tr>`}</tbody></table></div>`}
function renderDashboard(){const c=counts();const recent=[...drivers].filter(d=>statusKey(d.status)!=='pendente').slice(-8).reverse();main.innerHTML=header('Dashboard','Visão geral da conferência de motoristas')+stats()+progress()+`<div class="panel"><div class="panel-head"><div><h2>Últimas consultas</h2><p>Somente consultas já realizadas.</p></div></div>${table(recent)}</div>`}
function renderMotoristas(){let data=drivers.filter(d=>(filter==='TODOS'||statusKey(d.status)===filter)&&norm(`${d.nome} ${d.cpf} ${d.renach}`).includes(norm(query)));main.innerHTML=header('Motoristas','Motoristas carregados no Supabase')+`<div class="toolbar"><div class="search">⌕ <input placeholder="Buscar por nome, CPF ou RENACH..." value="${esc(query)}" oninput="query=this.value;render()"></div><select class="select" onchange="filter=this.value;render()"><option value="TODOS">Todos</option><option value="pendente">Pendente</option><option value="processando">Processando</option><option value="sucesso">Sucesso</option><option value="atencao">Atenção</option><option value="erro">Erro</option></select></div><div class="panel"><p><b>${data.length}</b> motoristas encontrados</p>${table(data.slice(0,50))}</div>`}
function nextPending(){return drivers.find(d=>['pendente','processando'].includes(statusKey(d.status)))||null}
function currentDriver(){if(selected)return selected;return nextPending()}
function renderProcessamento(){const d=currentDriver();if(!d){main.innerHTML=header('Processamento','Fila de consultas')+`<div class="panel empty"><h2>Fila concluída 🎉</h2><p>Não há motoristas pendentes para consulta.</p></div>`;return}selected=d;const c=counts();main.innerHTML=header('Processamento','Faça a consulta no portal oficial e registre o resultado')+`<div class="panel"><div class="panel-head"><div><h2>Fila de consulta</h2><p>${c.done} concluídos de ${c.total} motoristas.</p></div>${badge(d.status)}</div><div class="progress"><div style="width:${c.total?Math.round(c.done/c.total*100):0}%"></div></div></div><div class="process-grid"><div class="panel"><div class="eyebrow">MOTORISTA ATUAL</div><h2>${esc(d.nome)}</h2><div class="fields"><span>CPF<b>${maskCPF(d.cpf)}</b></span><span>RENACH<b>${esc(d.renach||'—')}</b></span></div><div class="det-card"><h3>1. Abra a consulta oficial</h3><p>O botão abre o portal do DETRAN-MT em uma nova aba. O CPF e o RENACH ficam prontos para copiar.</p><div class="copy-row"><button class="copy-chip" onclick="copyText('${esc(d.cpf)}','CPF copiado')">📋 CPF <b>${maskCPF(d.cpf)}</b></button><button class="copy-chip" onclick="copyText('${esc(d.renach||'')}','RENACH copiado')">📋 RENACH <b>${esc(d.renach||'—')}</b></button><button class="copy-chip" onclick="copyBoth()">📋 Copiar os dois</button></div><div class="actions" style="margin-top:12px"><button class="btn primary" style="flex:1" onclick="openDetran()">🔵 Abrir DETRAN-MT</button></div><div class="hint">Depois de consultar no DETRAN, volte para esta aba e registre o resultado abaixo. O reCAPTCHA continua sendo feito normalmente no portal.</div></div><div class="result-buttons"><button class="btn success" onclick="finishDriver('sucesso')">✓ Sucesso</button><button class="btn warning" onclick="finishDriver('atencao')">⚠ Atenção</button><button class="btn danger" onclick="finishDriver('erro')">✕ Erro</button></div></div><div class="panel"><div class="eyebrow">COMO FUNCIONA</div><h2>Consulta assistida</h2><p>1. Abra o DETRAN.</p><p>2. Preencha/cole CPF e RENACH.</p><p>3. Resolva o reCAPTCHA quando solicitado.</p><p>4. Clique em Consultar.</p><p>5. Volte aqui e registre o resultado.</p><hr style="border:0;border-top:1px solid #edf0f4;margin:18px 0"><button class="btn" style="width:100%" onclick="openDetails('${d.id}')">Ver detalhes do motorista</button></div></div>`}
async function copyText(value,label){try{await navigator.clipboard.writeText(String(value||''));msg(label)}catch{msg('Não foi possível copiar automaticamente.',true)}}
async function copyBoth(){const d=currentDriver();if(!d)return;await copyText(`CPF: ${d.cpf}\nRENACH: ${d.renach||''}`,'CPF + RENACH copiados')}
function openDetran(){const d=currentDriver();if(!d)return;copyBoth();window.open('https://www.detran.mt.gov.br/servicos-online','_blank','noopener,noreferrer');msg('DETRAN aberto. CPF + RENACH foram copiados.')}
async function finishDriver(status){const d=currentDriver();if(!d)return;const label=status==='sucesso'?'CNH consultada no DETRAN':status==='atencao'?'Conferência manual necessária':'Erro na consulta';const {error}=await supabaseClient.from('motoristas').update({status,resultado:label,data_consulta:new Date().toISOString()}).eq('id',d.id);if(error){console.error(error);msg('Não foi possível salvar o resultado.',true);return}await loadDrivers();selected=null;msg('Resultado salvo. Próximo motorista carregado.');render()}
function openDetails(id){const d=drivers.find(x=>String(x.id)===String(id));if(!d)return;document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><div><h2>Detalhes do motorista</h2><p>Dados armazenados no sistema.</p></div><button class="close" onclick="document.getElementById('modal').remove()">×</button></div><div class="details"><div><span>Nome</span><b>${esc(d.nome)}</b></div><div><span>CPF</span><b>${esc(fullCPF(d.cpf))}</b></div><div><span>RENACH</span><b>${esc(d.renach||'—')}</b></div><div><span>Status</span><b>${badge(d.status)}</b></div><div><span>Resultado</span><b>${esc(d.resultado||'—')}</b></div><div><span>Consulta</span><b>${d.data_consulta?new Date(d.data_consulta).toLocaleString('pt-BR'):'—'}</b></div></div><div class="actions"><button class="btn primary" style="flex:1" onclick="document.getElementById('modal').remove();selected=drivers.find(x=>x.id==='${d.id}');page='processamento';render()">Consultar este motorista</button><button class="btn" onclick="document.getElementById('modal').remove()">Fechar</button></div></div></div>`)}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({dashboard:renderDashboard,motoristas:renderMotoristas,processamento:renderProcessamento}[page]||renderDashboard)()}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;page=b.dataset.page;render()}
supabaseClient.auth.getSession().then(({data})=>{if(data.session){showSystem();loadDrivers().then(render)}else showLogin()});
</script></body></html>
