<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

/*
  SUPABASE
  A URL já está configurada. Cole aqui SOMENTE a Publishable Key.
  Nunca coloque a Secret Key neste arquivo.
*/
const SUPABASE_URL = "https://antkqvrbcebqucqdkmau.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Xc2Y7koEBU-BCGwsgMPDiw_ObyBXQ-I";

const supabaseClient =
  SUPABASE_PUBLISHABLE_KEY &&
  SUPABASE_PUBLISHABLE_KEY !== "COLE_AQUI_SUA_PUBLISHABLE_KEY"
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
    : null;

const loginOverlay = document.getElementById("loginOverlay");
const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");

function setLoginMessage(message, type="info"){
  loginMessage.textContent = message;
  loginMessage.className = "login-message " + type;
}

async function showSystem(){
  loginOverlay.style.display = "none";
  await loadDrivers();
  render();
}

function showLogin(){
  loginOverlay.style.display = "grid";
}

async function loadDrivers(){
  if(!supabaseClient) return;
  const {data, error} = await supabaseClient
    .from("motoristas")
    .select("id,nome,cpf,renach,status,resultado,data_consulta,criado_em")
    .order("criado_em", {ascending:false})
    .limit(1000);

  if(error){
    console.error(error);
    setLoginMessage("Login realizado, mas não foi possível carregar os motoristas: " + error.message,"error");
    return;
  }

  drivers = (data || []).map(d => ({
    ...d,
    result: d.resultado || "-",
    data: d.data_consulta ? new Date(d.data_consulta).toLocaleString("pt-BR") : "-",
    tempo: "-",
    tentativas: "-"
  }));
}

async function initAuth(){
  if(!supabaseClient){
    setLoginMessage("Cole a Publishable Key do Supabase neste arquivo antes de testar o login.","error");
    return;
  }

  const {data, error} = await supabaseClient.auth.getSession();

  if(error){
    console.error(error);
    setLoginMessage("Não foi possível verificar a sessão.","error");
    return;
  }

  if(data.session){
    await showSystem();
  }else{
    showLogin();
  }

  supabaseClient.auth.onAuthStateChange((_event, session)=>{
    if(session) showSystem();
    else showLogin();
  });
}

loginForm.addEventListener("submit", async (event)=>{
  event.preventDefault();

  if(!supabaseClient){
    setLoginMessage("Falta configurar a Publishable Key do Supabase.","error");
    return;
  }

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  setLoginMessage("Entrando...","info");

  const {data, error} = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    console.error(error);
    setLoginMessage(
      "Não foi possível entrar. Confira o e-mail, a senha e se o usuário está confirmado no Supabase.",
      "error"
    );
    return;
  }

  setLoginMessage("Login realizado.","info");
  showSystem();
});

async function logout(){
  if(supabaseClient) await supabaseClient.auth.signOut();
  showLogin();
}


const names=["João da Silva","Maria Souza","Carlos Oliveira","Ana Santos","Pedro Almeida","Lucas Ferreira","Juliana Costa","Marcos Pereira","Fernanda Lima","Rafael Gomes","Bruna Martins","Diego Rodrigues","Camila Barbosa","André Carvalho","Larissa Rocha","Gustavo Mendes","Patrícia Nunes","Eduardo Castro","Renata Alves","Thiago Ribeiro"];
let drivers=[];
let page="dashboard", selected=null, paused=false, query="", filter="TODOS";
let execucaoId = localStorage.getItem("cnh_execucao_id") || null;

function mask(c){return"***.***.***-"+c.slice(-2)}
function badge(s){let c={SUCESSO:"success",ATENCAO:"attention",ERRO:"error",PENDENTE:"pending",PROCESSANDO:"processing",CAPTCHA:"captcha",BLOQUEADO:"error"}[s]||"pending";let l={SUCESSO:"Sucesso",ATENCAO:"Atenção",ERRO:"Erro",PENDENTE:"Pendente",PROCESSANDO:"Processando",CAPTCHA:"CAPTCHA",BLOQUEADO:"Bloqueado"}[s];return`<span class="badge ${c}">${l}</span>`}
function header(title,sub){return`<div class="top"><div><h1>${title}</h1><p>${sub}</p></div><div class="top-actions"><span class="system"><i></i>Sistema operacional</span><button class="icon" onclick="toggleTheme()">☾</button><button class="icon" onclick="logout()" title="Sair">↪</button></div></div>`}
function table(data){return`<div class="table-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>RENACH</th><th>Status</th><th>Resultado</th><th>Consulta</th><th>Ações</th></tr></thead><tbody>${data.map(d=>`<tr><td><b>${d.nome}</b></td><td>${mask(d.cpf)}</td><td>${d.renach}</td><td>${badge(d.status)}</td><td>${d.result}</td><td>${d.data}</td><td><button class="view" onclick="openDetails(${JSON.stringify(d.id)})">Ver detalhes</button></td></tr>`).join("")}</tbody></table></div>`}
function stats(){
  const total = drivers.length;
  const processados = drivers.filter(d => d.status && d.status !== "PENDENTE").length;
  const sucesso = drivers.filter(d => d.status === "SUCESSO").length;
  const pendentes = drivers.filter(d => d.status === "PENDENTE" || !d.status).length;
  const atencao = drivers.filter(d => d.status === "ATENCAO").length;
  const erros = drivers.filter(d => d.status === "ERRO").length;
  const pct = total ? Math.round(processados / total * 100) : 0;
  return`<div class="cards">
${card("◉","Total de motoristas",total,"Supabase")}
${card("▣","Processados",processados,pct+"% do total")}
${card("✓","Conferidos",sucesso,"Status sucesso")}
${card("◷","Pendentes",pendentes,"Aguardando")}
${card("!","Atenção",atencao,"Revisão manual","yellow")}
${card("×","Erros",erros,"Necessitam revisão","red")}</div>`}
function card(icon,title,val,small,tone=""){return`<div class="card"><div class="card-icon ${tone}">${icon}</div><div><span>${title}</span><b>${val}</b><small>${small}</small></div></div>`}
function progress(){
  const total=drivers.length;
  const processados=drivers.filter(d=>d.status && d.status!=="PENDENTE").length;
  const sucesso=drivers.filter(d=>d.status==="SUCESSO").length;
  const atencao=drivers.filter(d=>d.status==="ATENCAO").length;
  const erros=drivers.filter(d=>d.status==="ERRO").length;
  const pendentes=drivers.filter(d=>d.status==="PENDENTE" || !d.status).length;
  const pct=total?Math.round(processados/total*100):0;
  return`<div class="panel"><div class="panel-head"><div><h2>Processamento atual</h2><p>Conferência em andamento.</p></div>${badge("PROCESSANDO")}</div><div class="progress"><div style="width:${pct}%"></div></div><div class="progress-row"><b>${processados} / ${total}</b><span>${pct}%</span></div><div class="mini"><div><span>Processados</span><b>${processados}</b></div><div><span>Sucesso</span><b class="green">${sucesso}</b></div><div><span>Atenção</span><b class="yellow">${atencao}</b></div><div><span>Erros</span><b class="red">${erros}</b></div><div><span>Pendentes</span><b>${pendentes}</b></div></div><div class="alert" style="margin-top:12px"><p>O processamento é iniciado manualmente, motorista por motorista, nesta etapa de teste.</p></div></div>`}

function renderDashboard(){main.innerHTML=header("Dashboard","Visão geral da conferência de motoristas")+stats()+progress()+`<div class="panel"><div class="panel-head"><div><h2>Últimas consultas</h2><p>Atividade recente do processamento.</p></div></div>${drivers.length?table(drivers.slice(0,8)):"<p>Nenhum motorista cadastrado no Supabase ainda.</p>"}</div>`}
function renderMotoristas(){let data=drivers.filter(d=>(filter==="TODOS"||d.status===filter)&&(`${d.nome} ${d.cpf} ${d.renach}`).toLowerCase().includes(query.toLowerCase()));main.innerHTML=header("Motoristas","Todos os motoristas importados")+`<div class="toolbar"><div class="search">⌕ <input placeholder="Buscar por nome, CPF ou RENACH..." value="${query}" oninput="query=this.value;render()"></div><select class="select" onchange="filter=this.value;render()"><option value="TODOS">Todos</option><option>PENDENTE</option><option>PROCESSANDO</option><option>SUCESSO</option><option>ATENCAO</option><option>ERRO</option></select></div><div class="panel"><p><b>${data.length}</b> motoristas encontrados</p>${data.length?table(data):"<p>Nenhum motorista encontrado.</p>"}</div>`}
function renderImportar(){main.innerHTML=header("Importar Excel","Adicione a lista de motoristas para conferência")+`<div class="panel"><label class="upload" for="excel"><div class="upload-icon">⇧</div><h3>Importe sua planilha de motoristas</h3><p>Arraste seu arquivo Excel aqui ou clique para selecionar.</p><b>.xlsx · .xls</b><input id="excel" type="file" accept=".xlsx,.xls" onchange="fileChosen(this.files[0])"></label></div>`}
function fileChosen(f){if(!f)return;if(!/\.(xlsx|xls)$/i.test(f.name)){alert("Selecione um arquivo Excel.");return}main.innerHTML=header("Importar Excel","Prévia e mapeamento da planilha")+`<div class="panel"><div class="file-card"><div>▣</div><div><b>${f.name}</b><small>${(f.size/1024/1024).toFixed(2)} MB · 600 registros encontrados</small></div><b class="check">✓</b></div><div class="mapping"><h2>Mapear colunas</h2><p>Confirme as colunas da sua planilha.</p><label>Nome<select><option>Nome</option><option>Nome completo</option></select></label><label>CPF<select><option>CPF</option></select></label><label>RENACH<select><option>RENACH</option></select></label></div><div class="preview"><h2>Prévia</h2><div class="preview-grid"><b>Nome</b><b>CPF</b><b>RENACH</b>${drivers.slice(0,5).map(d=>`<div class="row"><span>${d.nome}</span><span>${mask(d.cpf)}</span><span>${d.renach}</span></div>`).join("")}</div></div><button class="btn primary" style="margin-top:18px" onclick="alert('Planilha preparada para processamento.')">✓ Confirmar importação</button></div>`}
function renderProcessamento(){
  const d=drivers.find(x=>x.status==="PROCESSANDO") || drivers.find(x=>x.status==="PENDENTE");
    const pendentes=drivers.filter(x=>x.status==="PENDENTE" || !x.status).length;

  main.innerHTML=header("Processamento","Fila de conferência dos motoristas")+progress()+`
  <div class="process-grid">
    <div class="panel">
      <div class="eyebrow">MOTORISTA ATUAL</div>
      ${d?`
        <h2>${d.nome}</h2>
        <div class="fields">
          <span>CPF<b>${mask(d.cpf)}</b></span>
          <span>RENACH<b>${d.renach}</b></span>
        </div>
        <div class="processing">
          ${d.status==="PROCESSANDO"
            ? '<span class="spinner"></span>Motorista em processamento.'
            : 'Pronto para iniciar a conferência deste motorista.'}
        </div>
      `:"<h2>Nenhum motorista aguardando processamento.</h2>"}
    </div>

    <div class="panel">
      <div class="eyebrow">CONTROLE DA FILA</div>
      <p>${pendentes} motorista(s) pendente(s).</p>

      ${d && d.status==="PROCESSANDO" ? `
        <div class="actions" style="display:grid;gap:8px">
          <button class="btn primary" onclick="setResultadoAtual('SUCESSO','CNH encontrada')">✓ Marcar Sucesso</button>
          <button class="btn" onclick="setResultadoAtual('ATENCAO','Conferência necessária')">! Marcar Atenção</button>
          <button class="btn danger" onclick="setResultadoAtual('ERRO','Erro na consulta')">× Marcar Erro</button>
          <button class="btn" onclick="setResultadoAtual('PENDENTE','Aguardando processamento')">↩ Voltar para Pendente</button>
        </div>
      ` : d ? `
        <button class="btn primary" style="width:100%;justify-content:center" onclick="iniciarProximo()">▶ Iniciar próximo</button>
      ` : `
        <button class="btn" style="width:100%;justify-content:center" disabled>Fila concluída</button>
      `}
    </div>
  </div>

  <div class="alert">
    ⚠ <p><b>Modo de teste:</b> esta etapa controla a fila e grava os status no Supabase. A consulta real ao DETRAN ainda será integrada depois.</p>
  </div>
  <div class="panel">
    <div class="panel-head">
      <div><h2>Execução atual</h2><p>Histórico da rodada de processamento.</p></div>
      <span class="badge ${execucaoId ? "processing" : "pending"}">${execucaoId ? "Em andamento" : "Sem execução ativa"}</span>
    </div>
    <p>${execucaoId ? "Esta rodada será atualizada no Supabase a cada motorista processado." : "Clique em Iniciar próximo para criar uma nova execução no histórico."}</p>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div><h2>Como funciona</h2><p>O sistema pega um motorista por vez e grava a situação no banco.</p></div>
    </div>
    <div class="mini">
      <div><span>Próximo</span><b>${d ? d.nome : "—"}</b></div>
      <div><span>Status</span><b>${d ? d.status : "—"}</b></div>
      <div><span>Pendentes</span><b>${pendentes}</b></div>
      <div><span>Processados</span><b>${drivers.filter(x=>x.status && x.status!=="PENDENTE").length}</b></div>
      <div><span>Total</span><b>${drivers.length}</b></div>
    </div>
  </div>`;
}
function renderResultados(){
  const processados=drivers.filter(d=>d.status && d.status!=="PENDENTE").length;
  const atencao=drivers.filter(d=>d.status==="ATENCAO").length;
  const erros=drivers.filter(d=>d.status==="ERRO").length;
  const rows=drivers.filter(d=>d.status!=="PENDENTE");
  main.innerHTML=header("Resultados","Resultados da conferência atual")+`<div class="cards" style="grid-template-columns:repeat(3,1fr)">${card("✓","Total",processados,"Processados")}${card("!","Atenção",atencao,"Revisão manual","yellow")}${card("×","Erros",erros,"Necessitam revisão","red")}</div><div class="panel"><div class="panel-head"><div><h2>Resultados</h2><p>Resultados registrados no Supabase.</p></div><div class="actions"><button class="btn primary" onclick="alert('Exportação será conectada ao backend.')">⇩ Excel</button><button class="btn" onclick="alert('Exportação será conectada ao backend.')">⇩ CSV</button></div></div>${rows.length?table(rows):"<p>Nenhum resultado registrado ainda.</p>"}</div>`
}
async function renderExecucoes(){
  main.innerHTML=header("Execuções","Histórico das rodadas de processamento")+
    `<div class="panel" id="execucoesPanel">
      <div class="panel-head">
        <div><h2>Histórico de execuções</h2><p>Cada rodada registra quem iniciou, quando começou e os resultados acumulados.</p></div>
        <button class="btn" onclick="renderExecucoes()">↻ Atualizar</button>
      </div>
      <div class="table-wrap"><table><thead><tr>
        <th>Início</th><th>Status</th><th>Total</th><th>Processados</th><th>Sucesso</th><th>Atenção</th><th>Erros</th><th>Fim</th>
      </tr></thead><tbody id="execucoesBody">
        <tr><td colspan="8">Carregando...</td></tr>
      </tbody></table></div>
    </div>`;

  if(!supabaseClient){
    document.getElementById("execucoesBody").innerHTML='<tr><td colspan="8">Supabase não configurado.</td></tr>';
    return;
  }

  const {data,error}=await supabaseClient
    .from("execucoes")
    .select("id,status,total,processados,sucesso,atencao,erros,criado_em,finalizado_em")
    .order("criado_em",{ascending:false})
    .limit(50);

  if(error){
    console.error(error);
    document.getElementById("execucoesBody").innerHTML=`<tr><td colspan="8">Não foi possível carregar as execuções: ${error.message}</td></tr>`;
    return;
  }

  if(!data || !data.length){
    document.getElementById("execucoesBody").innerHTML='<tr><td colspan="8">Nenhuma execução registrada ainda.</td></tr>';
    return;
  }

  const statusLabel={
    EM_ANDAMENTO:"Em andamento",
    CONCLUIDA:"Concluída",
    PAUSADA:"Pausada",
    CANCELADA:"Cancelada"
  };

  document.getElementById("execucoesBody").innerHTML=data.map(e=>`<tr>
    <td>${e.criado_em ? new Date(e.criado_em).toLocaleString("pt-BR") : "-"}</td>
    <td>${badge(e.status==="CONCLUIDA"?"SUCESSO":e.status==="EM_ANDAMENTO"?"PROCESSANDO":e.status==="CANCELADA"?"ERRO":"ATENCAO")}</td>
    <td>${e.total ?? 0}</td>
    <td>${e.processados ?? 0}</td>
    <td class="green"><b>${e.sucesso ?? 0}</b></td>
    <td class="yellow"><b>${e.atencao ?? 0}</b></td>
    <td class="red"><b>${e.erros ?? 0}</b></td>
    <td>${e.finalizado_em ? new Date(e.finalizado_em).toLocaleString("pt-BR") : "-"}</td>
  </tr>`).join("");
}

function renderLogs(){let logs=[["14:32:10","João Silva","Consulta iniciada","INFO"],["14:32:13","João Silva","Resultado recebido","SUCCESS"],["14:33:01","Maria Souza","Erro","ERROR"],["14:33:25","Carlos Oliveira","Consulta concluída","SUCCESS"],["14:34:02","Ana Santos","Atenção","WARNING"]];main.innerHTML=header("Logs","Histórico das atividades do sistema")+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Horário</th><th>Motorista</th><th>Ação</th><th>Status</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${l[0]}</td><td><b>${l[1]}</b></td><td>${l[2]}</td><td>${badge(l[3]==="SUCCESS"?"SUCESSO":l[3]==="ERROR"?"ERRO":l[3]==="WARNING"?"ATENCAO":"PROCESSANDO")}</td></tr>`).join("")}</tbody></table></div></div>`}
function renderConfig(){main.innerHTML=header("Configurações","Preferências da interface")+`<div class="settings-grid"><div class="panel setting"><h2>Geral</h2><p>Informações do sistema.</p><label>Nome<input value="DETRAN-MT CNH Checker" readonly></label><label>URL do portal<input value="https://www.detran.mt.gov.br/consulte-sua-habilitacao" readonly></label></div><div class="panel setting"><h2>Processamento</h2><p>Preferências para a futura integração.</p><label>Intervalo mínimo<input type="number" value="1500"></label><label>Intervalo máximo<input type="number" value="4000"></label><label>Limite por execução<input type="number" value="600"></label></div></div><button class="btn primary" onclick="alert('Configurações salvas neste navegador.')">✓ Salvar configurações</button>`}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));({dashboard:renderDashboard,motoristas:renderMotoristas,importar:renderImportar,processamento:renderProcessamento,resultados:renderResultados,logs:renderLogs,configuracoes:renderConfig,execucoes:renderExecucoes}[page]||renderDashboard)()}
document.getElementById("nav").onclick=e=>{let b=e.target.closest("button");if(!b)return;page=b.dataset.page;render()};
async function criarExecucao(){
  if(!supabaseClient) return {ok:false, message:"Supabase não configurado."};

  const {data:{user}} = await supabaseClient.auth.getUser();
  if(!user) return {ok:false, message:"Usuário não autenticado."};

  const total = drivers.length;
  const {data, error} = await supabaseClient
    .from("execucoes")
    .insert({
      usuario_id:user.id,
      status:"EM_ANDAMENTO",
      total,
      processados:drivers.filter(x=>x.status && x.status!=="PENDENTE" && x.status!=="PROCESSANDO").length,
      sucesso:drivers.filter(x=>x.status==="SUCESSO").length,
      atencao:drivers.filter(x=>x.status==="ATENCAO").length,
      erros:drivers.filter(x=>x.status==="ERRO").length
    })
    .select("id")
    .single();

  if(error){
    console.error(error);
    return {ok:false, message:error.message};
  }

  execucaoId=data.id;
  localStorage.setItem("cnh_execucao_id", execucaoId);
  return {ok:true, id:execucaoId};
}

async function atualizarExecucao(status=null){
  if(!supabaseClient || !execucaoId) return {ok:true};

  const payload={
    total:drivers.length,
    processados:drivers.filter(x=>x.status && x.status!=="PENDENTE" && x.status!=="PROCESSANDO").length,
    sucesso:drivers.filter(x=>x.status==="SUCESSO").length,
    atencao:drivers.filter(x=>x.status==="ATENCAO").length,
    erros:drivers.filter(x=>x.status==="ERRO").length
  };

  if(status) payload.status=status;
  if(status==="CONCLUIDA" || status==="CANCELADA") payload.finalizado_em=new Date().toISOString();

  const {error}=await supabaseClient.from("execucoes").update(payload).eq("id",execucaoId);
  if(error){
    console.error(error);
    return {ok:false,message:error.message};
  }
  return {ok:true};
}

async function garantirExecucao(){
  if(execucaoId){
    const {data,error}=await supabaseClient.from("execucoes").select("id,status").eq("id",execucaoId).maybeSingle();
    if(!error && data && data.status==="EM_ANDAMENTO") return {ok:true};
    execucaoId=null;
    localStorage.removeItem("cnh_execucao_id");
  }
  return criarExecucao();
}

async function updateDriverStatus(id, status, resultado){
  if(!supabaseClient) return {ok:false, message:"Supabase não configurado."};

  const payload = {
    status,
    resultado,
    data_consulta: status==="PROCESSANDO" ? null : new Date().toISOString()
  };

  const {data, error} = await supabaseClient
    .from("motoristas")
    .update(payload)
    .eq("id", id)
    .select("id,nome,cpf,renach,status,resultado,data_consulta,criado_em")
    .single();

  if(error){
    console.error(error);
    return {ok:false, message:error.message};
  }

  const idx = drivers.findIndex(x=>x.id===id);
  if(idx>=0){
    drivers[idx] = {
      ...data,
      result:data.resultado || "-",
      data:data.data_consulta ? new Date(data.data_consulta).toLocaleString("pt-BR") : "-",
      tempo:"-",
      tentativas:drivers[idx].tentativas || 1
    };
  }

  return {ok:true};
}

async function iniciarProximo(){
  if(paused) return;

  const atual = drivers.find(x=>x.status==="PROCESSANDO");
  if(atual){
    alert("Já existe um motorista em processamento.");
    return;
  }

  const d = drivers.find(x=>x.status==="PENDENTE" || !x.status);
  if(!d){
    await atualizarExecucao("CONCLUIDA");
    alert("Não existem motoristas pendentes.");
    render();
    return;
  }

  const exec = await garantirExecucao();
  if(!exec.ok){
    alert("Não foi possível iniciar a execução: " + exec.message);
    return;
  }

  const btns = document.querySelectorAll(".btn.primary");
  btns.forEach(b=>b.disabled=true);

  const result = await updateDriverStatus(d.id, "PROCESSANDO", "Consulta iniciada");

  if(!result.ok){
    alert("Não foi possível iniciar o motorista: " + result.message);
    btns.forEach(b=>b.disabled=false);
    return;
  }

  await atualizarExecucao("EM_ANDAMENTO");
  render();
}

async function setResultadoAtual(status, resultado){
  const d = drivers.find(x=>x.status==="PROCESSANDO");
  if(!d){
    alert("Nenhum motorista está em processamento.");
    return;
  }

  const result = await updateDriverStatus(d.id, status, resultado);

  if(!result.ok){
    alert("Não foi possível atualizar o motorista: " + result.message);
    return;
  }

  const restantes=drivers.filter(x=>x.status==="PENDENTE" || !x.status).length;
  if(restantes===0){
    await atualizarExecucao("CONCLUIDA");
    localStorage.removeItem("cnh_execucao_id");
    execucaoId=null;
  }else{
    await atualizarExecucao("EM_ANDAMENTO");
  }

  render();
}

function openDetails(id){selected=drivers.find(d=>d.id===id);document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><div><h2>Detalhes do motorista</h2><p>Informações da conferência</p></div><button class="close" onclick="document.getElementById('modal').remove()">×</button></div><div class="details"><div><span>Nome</span><b>${selected.nome}</b></div><div><span>CPF</span><b>${mask(selected.cpf)}</b></div><div><span>RENACH</span><b>${selected.renach}</b></div><div><span>Status</span><b>${badge(selected.status)}</b></div><div><span>Resultado</span><b>${selected.result}</b></div><div><span>Data</span><b>${selected.data}</b></div><div><span>Tempo</span><b>${selected.tempo}</b></div><div><span>Tentativas</span><b>${selected.tentativas}</b></div></div><button class="btn primary" style="width:100%;justify-content:center" onclick="document.getElementById('modal').remove()">Fechar</button></div></div>`)}
function captcha(){document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="captchaModal"><div class="modal captcha-box"><div class="captcha-icon">⚠</div><h2>Intervenção necessária</h2><p>O portal solicitou uma verificação humana.</p><div class="alert"><p>Realize a verificação no navegador e depois clique em <b>Continuar</b>.</p></div><div class="modal-actions"><button class="btn" onclick="document.getElementById('captchaModal').remove()">Cancelar</button><button class="btn primary" onclick="document.getElementById('captchaModal').remove()">Continuar</button></div></div></div>`)}
function toggleTheme(){document.body.style.filter=document.body.style.filter?"":"brightness(.92)"}
render();
initAuth();
</script>
