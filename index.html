loginForm.addEventListener('submit',async e=>{e.preventDefault();setLogin('Entrando...','info');const {error}=await supabaseClient.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(error){setLogin('E-mail ou senha inválidos.','error');return}showSystem();await loadDrivers();render()});
async function logout(){await supabaseClient.auth.signOut();showLogin()}
function maskCPF(cpf){const s=String(cpf||'').replace(/\D/g,'');return s.length>=11?s.slice(0,3)+'.***.***-'+s.slice(-2):s||'—'}
function fullCPF(cpf){const s=String(cpf||'').replace(/\D/g,'');return s.length===11?s.slice(0,3)+'.'+s.slice(3,6)+'.'+s.slice(6,9)+'-'+s.slice(9):String(cpf||'—')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function statusKey(s){return String(s||'pendente').toLowerCase()}
function badge(s){const k=statusKey(s),map={sucesso:['success-badge','Sucesso'],atencao:['attention-badge','Atenção'],erro:['error-badge','Erro'],pendente:['pending-badge','Pendente'],processando:['processing-badge','Processando']};const [c,l]=map[k]||map.pendente;return `<span class="badge ${c}">${l}</span>`}
function topbar(){return `<div class="topbar"><div class="global-search"><span style="font-size:21px;color:#123e78">⌕</span><input placeholder="Conferência de motoristas do DETRAN-MT..." onkeydown="if(event.key==='Enter'){page='motoristas';query=this.value;currentPage=1;render()}"></div><div class="top-right"><button class="top-icon" title="Notificações" style="position:relative">♧<span style="position:absolute;right:7px;top:5px;width:7px;height:7px;border-radius:50%;background:#e3293d;box-shadow:0 0 0 2px #fff"></span></button><div class="user"><span class="avatar">AD</span><span>Administrador</span><b style="font-size:15px;margin-left:3px">⌄</b></div></div></div>`}
function header(title,sub,withDate=false){return topbar()+`<div class="top-title"><div><h1>${title}</h1><p>${sub}</p></div>${withDate?`<div class="datebox"><span class="date-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="16" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M7 3v4M17 3v4M3.5 9.5h17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 13h2M14 13h2M8 17h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span><b id="dashboardDate">21 de setembro de 2026</b><span id="dashboardTime">20:34</span></span></div>`:''}</div>`}
function statIcon(type){
 const icons={
  users:`<svg viewBox="0 0 32 32" fill="none"><circle cx="12" cy="10" r="5" fill="currentColor"/><circle cx="22" cy="12" r="4" fill="currentColor" opacity=".82"/><path d="M4 26c.7-6 4-9 9-9s8.3 3 9 9" fill="currentColor"/><path d="M18 20c1.5-2 3.3-3 5.5-3 3.2 0 5.2 2.4 5.5 6" fill="currentColor" opacity=".82"/></svg>`,
  check:`<svg viewBox="0 0 32 32" fill="none"><path d="m7 16 6 6L26 9" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  alert:`<svg viewBox="0 0 32 32" fill="none"><path d="M16 5 29 27H3L16 5Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M16 12v7M16 23v.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>`,
  error:`<svg viewBox="0 0 32 32" fill="none"><path d="M9 9l14 14M23 9 9 23" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>`,
  clock:`<svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="11" stroke="currentColor" stroke-width="3"/><path d="M16 9v8l5 3" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`
 };
 return icons[type]||icons.clock;
}
function stats(){const c=counts();return `<div class="stat-cards">
<div class="stat-card"><div class="stat-icon blue">${statIcon('users')}</div><div class="stat-copy"><span>Total de motoristas</span><b>${c.total}</b><small>Base atual</small></div></div>
<div class="stat-card"><div class="stat-icon green">${statIcon('check')}</div><div class="stat-copy"><span>Sucesso</span><b>${c.suc}</b><small>Consultas concluídas</small></div></div>
<div class="stat-card"><div class="stat-icon yellow">${statIcon('alert')}</div><div class="stat-copy"><span>Atenção</span><b>${c.att}</b><small>Revisão manual</small></div></div>
<div class="stat-card"><div class="stat-icon red">${statIcon('error')}</div><div class="stat-copy"><span>Erros</span><b>${c.err}</b><small>Necessitam revisão</small></div></div>
<div class="stat-card"><div class="stat-icon purple">${statIcon('clock')}</div><div class="stat-copy"><span>Pendentes</span><b>${c.pend}</b><small>Aguardando consulta</small></div></div>
</div>`}
function progress(){const c=counts(),pct=c.total?Math.round(c.done/c.total*100):0;return `<div class="dashboard-progress">
<div class="progress-card"><h2>Progresso da conferência</h2><div class="progress-track"><div style="width:${pct}%"></div></div><div class="progress-meta"><b>${c.done} de ${c.total} motoristas processados</b><span class="pct">${pct}%</span></div></div>
<div class="start-card"><button onclick="page='processamento';selected=null;render()"><span class="play-icon"><svg viewBox="0 0 24 24" fill="white"><path d="M8 5.5v13L19 12 8 5.5Z"/></svg></span><span class="start-text"><strong>Iniciar processamento</strong><small>Consultar motoristas no DETRAN-MT</small></span></button></div>
</div>`}
function dashboardLower(){const c=counts();return `<div class="dashboard-lower">
<div class="dash-panel"><h2>Status atual</h2><div class="status-list">
<div class="status-row"><span class="status-left"><i class="status-ball" style="background:#11bd68"></i>Concluídos</span><b>${c.done}</b></div>
<div class="status-row"><span class="status-left"><i class="status-ball" style="background:#2879e8"></i>Em processamento</span><b>${c.proc}</b></div>
<div class="status-row"><span class="status-left"><i class="status-ball" style="background:#b8c7d9"></i>Pendentes</span><b>${c.pend}</b></div>
<div class="status-row"><span class="status-left"><i class="status-ball" style="background:#ffc21d"></i>Atenção</span><b>${c.att}</b></div>
<div class="status-row"><span class="status-left"><i class="status-ball" style="background:#f12f43"></i>Erros</span><b>${c.err}</b></div>
</div></div>
<div class="dash-panel"><h2><span class="panel-title-icon">◷</span>Atividade recente</h2><div class="activity-empty"><div class="activity-clock">${statIcon('clock')}</div>Nenhuma consulta realizada ainda.<small>As consultas aparecerão aqui em tempo real.</small></div></div>
<div class="dash-panel"><h2><span class="tip-bulb">💡</span>Dicas</h2><div class="tips">
<div class="tip-row"><span class="tip-check">✓</span>Mantenha sua conexão estável</div>
<div class="tip-row"><span class="tip-check">✓</span>Use o processamento assistido</div>
<div class="tip-row"><span class="tip-check">✓</span>Verifique os resultados com atenção</div>
<div class="tip-row"><span class="tip-check">✓</span>Em caso de erro, revise manualmente</div>
<div class="quote">“Informação hoje, um trânsito mais seguro amanhã.”</div>
</div></div></div>`}
function renderDashboard(){main.innerHTML=`<div class="dashboard-page">${header('Dashboard','Visão geral da conferência de motoristas',true)}${stats()}${progress()}${dashboardLower()}</div>`}
function renderMotoristas(){
  let data=drivers.filter(d=>(filter==='TODOS'||statusKey(d.status)===filter)&&norm(`${d.nome} ${d.cpf} ${d.renach}`).includes(norm(query)));
  const pages=Math.max(1,Math.ceil(data.length/PAGE_SIZE));
  if(currentPage>pages)currentPage=pages;
  const shown=data.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);
  let pag='';
  for(let i=1;i<=pages;i++){
    if(i<=5||i===pages)pag+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="currentPage=${i};render()">${i}</button>`;
    else if(i===6&&pages>7)pag+=`<button class="page-btn" disabled>…</button>`;
  }
  main.innerHTML=`<div class="motoristas-page">${topbar()}
    <div class="motoristas-head">
      <div><h1>Motoristas</h1><p>Motoristas carregados no Supabase</p></div>
      <button class="btn primary import-btn" onclick="msg('Importação de motoristas será disponibilizada aqui.')">↥&nbsp; Importar motoristas</button>
    </div>
    <div class="motoristas-toolbar">
      <div class="motoristas-search"><span style="font-size:19px;font-weight:800">⌕</span><input placeholder="Buscar por nome, CPF ou RENACH..." value="${esc(query)}" oninput="query=this.value;currentPage=1;render()"></div>
      <select class="motoristas-select" onchange="filter=this.value;currentPage=1;render()">
        <option value="TODOS">Todos os status</option><option value="pendente">Pendente</option><option value="processando">Processando</option><option value="sucesso">Sucesso</option><option value="atencao">Atenção</option><option value="erro">Erro</option>
      </select>
      <div class="motoristas-found">${data.length} motoristas encontrados</div>
    </div>
    <div class="panel motoristas-list-card">
      ${table(shown,(currentPage-1)*PAGE_SIZE)}
      <div class="motoristas-pagination"><button class="page-btn" onclick="currentPage=Math.max(1,currentPage-1);render()">‹</button>${pag}<button class="page-btn" onclick="currentPage=Math.min(${pages},currentPage+1);render()">›</button></div>
    </div>
  </div>`;
}
async function loadDrivers(){
  loading=true;
  try{
    const {data,error}=await supabaseClient.from('motoristas').select('*').order('criado_em',{ascending:true});
    if(error){
      console.error(error);
      msg('Não foi possível carregar os motoristas do Supabase.',true);
      drivers=[];
      return;
    }
    drivers=Array.isArray(data)?data:[];
  }finally{loading=false}
}
function counts(){
  const total=drivers.length;
  const suc=drivers.filter(d=>statusKey(d.status)==='sucesso').length;
  const att=drivers.filter(d=>statusKey(d.status)==='atencao').length;
  const err=drivers.filter(d=>statusKey(d.status)==='erro').length;
  const proc=drivers.filter(d=>statusKey(d.status)==='processando').length;
  const pend=drivers.filter(d=>statusKey(d.status)==='pendente').length;
  return {total,suc,att,err,proc,pend,done:suc+att+err};
}
function table(rows,startIndex=0){
  if(!rows.length)return '<div class="empty"><h3>Nenhum motorista encontrado</h3><p>Não há registros para os filtros selecionados.</p></div>';
  return `<div class="motoristas-table-wrap"><table class="motoristas-table"><thead><tr><th>#</th><th>Nome</th><th>CPF</th><th>RENACH</th><th>Status</th><th>Resultado</th><th>Consulta</th><th>Ações</th></tr></thead><tbody>${rows.map((d,i)=>`<tr>
    <td class="num">${startIndex+i+1}</td>
    <td class="name">${esc(d.nome||'—')}</td>
    <td class="cpf">${esc(maskCPF(d.cpf))}</td>
    <td class="renach">${esc(d.renach||'—')}</td>
    <td>${badge(d.status)}</td>
    <td class="result">${esc(d.resultado||'—')}</td>
    <td class="result">${d.data_consulta?new Date(d.data_consulta).toLocaleString('pt-BR'):'—'}</td>
    <td><div class="actions-cell"><button class="view" onclick="openDetails('${esc(d.id)}')">◉&nbsp; Ver detalhes</button><button class="row-menu" title="Mais ações" onclick="openDetails('${esc(d.id)}')">⋮</button></div></td>
  </tr>`).join('')}</tbody></table></div>`;
}
function nextPending(){return drivers.find(d=>['pendente','processando'].includes(statusKey(d.status)))||null}
function currentDriver(){if(selected)return selected;return nextPending()}
function renderProcessamento(){const d=currentDriver();if(!d){main.innerHTML=header('Processamento','Faça a consulta no portal oficial e registre o resultado')+`<div class="panel empty"><h2>Fila concluída 🎉</h2><p>Não há motoristas pendentes para consulta.</p></div>`;return}selected=d;const c=counts();main.innerHTML=header('Processamento','Faça a consulta no portal oficial e registre o resultado')+`<div class="panel"><div class="panel-head"><div><h2>Fila de consulta</h2><p>${c.done} de ${c.total} concluídos</p></div><div>${badge(d.status)}</div></div><div class="progress"><div style="width:${c.total?Math.round(c.done/c.total*100):0}%"></div></div></div><div class="process-grid"><div class="panel process-main"><div class="current"><div class="eyebrow">MOTORISTA ATUAL</div><h2>${esc(d.nome)}</h2><div class="fields"><span>CPF<b>${maskCPF(d.cpf)}</b></span><span>RENACH<b>${esc(d.renach||'—')}</b></span></div><div class="det-card"><h3>↗ Consultar no DETRAN-MT</h3><p>Abra a página oficial “Consulte sua Habilitação” em uma nova aba.</p><div class="copy-row"><button class="copy-chip" onclick="copyText('${esc(d.cpf)}','CPF copiado')">▣ CPF <b>${maskCPF(d.cpf)}</b></button><button class="copy-chip" onclick="copyText('${esc(d.renach||'')}','RENACH copiado')">▣ RENACH <b>${esc(d.renach||'—')}</b></button><button class="copy-chip" onclick="copyBoth()">▣ Copiar os dois</button></div><button class="open-detran" onclick="openDetran()">↗ Abrir DETRAN-MT</button><div class="hint">Depois da consulta, volte para esta aba e registre o resultado. O reCAPTCHA continua sendo feito normalmente no portal.</div></div></div><div class="result-buttons"><button class="btn success" onclick="finishDriver('sucesso')">✓ Sucesso<small>Consulta realizada com sucesso</small></button><button class="btn warning" onclick="finishDriver('atencao')">⚠ Atenção<small>Necessita revisão manual</small></button><button class="btn danger" onclick="finishDriver('erro')">× Erro<small>Problema na consulta</small></button></div></div><div class="panel"><div class="eyebrow">COMO FUNCIONA?</div><h2>Consulta assistida</h2><div class="steps"><div class="step"><span class="step-num">1</span>Abra o site do DETRAN-MT</div><div class="step"><span class="step-num">2</span>Preencha o CPF e o RENACH</div><div class="step"><span class="step-num">3</span>Resolva o reCAPTCHA</div><div class="step"><span class="step-num">4</span>Clique em Consultar</div><div class="step"><span class="step-num">5</span>Volte aqui e registre o resultado</div></div><hr style="border:0;border-top:1px solid #edf0f4;margin:18px 0"><button class="btn" style="width:100%" onclick="openDetails('${d.id}')">▣ Ver detalhes do motorista</button></div></div>`}
async function copyText(value,label){try{await navigator.clipboard.writeText(String(value||''));msg(label)}catch{msg('Não foi possível copiar automaticamente.',true)}}
async function copyBoth(){const d=currentDriver();if(!d)return;await copyText(`CPF: ${d.cpf}\nRENACH: ${d.renach||''}`,'CPF + RENACH copiados')}
function openDetran(){const d=currentDriver();if(!d)return;copyBoth();window.open(DETRAN_URL,'_blank','noopener,noreferrer');msg('DETRAN aberto. CPF + RENACH foram copiados.')}
async function finishDriver(status){const d=currentDriver();if(!d)return;const label=status==='sucesso'?'CNH consultada no DETRAN':status==='atencao'?'Conferência manual necessária':'Erro na consulta';const {error}=await supabaseClient.from('motoristas').update({status,resultado:label,data_consulta:new Date().toISOString()}).eq('id',d.id);if(error){console.error(error);msg('Não foi possível salvar o resultado.',true);return}await loadDrivers();selected=null;msg('Resultado salvo. Próximo motorista carregado.');render()}
function openDetails(id){const d=drivers.find(x=>String(x.id)===String(id));if(!d)return;document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><div><h2>Detalhes do motorista</h2><p>Dados armazenados no sistema.</p></div><button class="close" onclick="document.getElementById('modal').remove()">×</button></div><div class="details"><div><span>Nome</span><b>${esc(d.nome)}</b></div><div><span>CPF</span><b>${esc(fullCPF(d.cpf))}</b></div><div><span>RENACH</span><b>${esc(d.renach||'—')}</b></div><div><span>Status</span><b>${badge(d.status)}</b></div><div><span>Resultado</span><b>${esc(d.resultado||'—')}</b></div><div><span>Consulta</span><b>${d.data_consulta?new Date(d.data_consulta).toLocaleString('pt-BR'):'—'}</b></div></div><div class="actions" style="display:flex;gap:8px"><button class="btn primary" style="flex:1" onclick="document.getElementById('modal').remove();selected=drivers.find(x=>x.id==='${d.id}');page='processamento';render()">Consultar este motorista</button><button class="btn" onclick="document.getElementById('modal').remove()">Fechar</button></div></div></div>`)}
function renderExecucoes(){
  const total=drivers.length, done=drivers.filter(d=>['sucesso','atenção','atencao','erro'].includes(String(d.status||'').toLowerCase())).length;
  const rows=drivers.filter(d=>d.data_consulta).sort((a,b)=>new Date(b.data_consulta)-new Date(a.data_consulta)).slice(0,20);
  main.innerHTML=`<div class="execucoes-page">${header('Execuções','Histórico das consultas realizadas no Supabase')}<div class="exec-card"><div class="exec-head"><div><h2>Histórico de execuções</h2><p>${done} consultas registradas de ${total} motoristas</p></div><button class="btn dark" onclick="page='processamento';render()">Nova execução</button></div>${rows.length?`<div class="exec-row header"><div>Motorista</div><div>CPF</div><div>Status</div><div>Consulta</div><div>Ações</div></div>${rows.map((d,i)=>`<div class="exec-row"><div><strong>${esc(d.nome||'—')}</strong></div><div>${maskCPF(d.cpf||'')}</div><div><span class="exec-status">${esc(d.status||'Concluída')}</span></div><div>${fmtDate(d.data_consulta)}</div><div><button class="btn small dark" onclick="showDetails('${d.id}')">Ver detalhes</button></div></div>`).join('')}`:`<div class="exec-empty"><strong>Nenhuma execução registrada</strong>As consultas realizadas aparecerão aqui.</div>`}</div></div>`;
}

function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({dashboard:renderDashboard,motoristas:renderMotoristas,processamento:renderProcessamento,execucoes:renderExecucoes}[page]||renderDashboard)()}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;page=b.dataset.page;render()}
supabaseClient.auth.getSession().then(({data})=>{if(data.session){showSystem();loadDrivers().then(render)}else showLogin()});
setInterval(()=>{const el=document.getElementById('dashboardTime');const de=document.getElementById('dashboardDate');if(el){const now=new Date();el.textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}if(de){const now=new Date();de.textContent=now.toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});}},1000);

</script>
</body>
</html>
