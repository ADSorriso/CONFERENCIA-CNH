<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

/*
  SUPABASE
  A URL já está configurada. Cole aqui SOMENTE a Publishable Key.
  Nunca coloque a Secret Key neste arquivo.
*/
const SUPABASE_URL = "https://antkqvrbcebqucqdkmau.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Xc2Y7koEBU-BCGwsgMPDiw_ObyBXQ-I";

const supabaseClient =
  SUPABASE_PUBLISHABLE_KEY !== "sb_publishable_Xc2Y7koEBU-BCGwsgMPDiw_ObyBXQ-I"
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
    : null;

const loginOverlay = document.getElementById("loginOverlay");
const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");

function setLoginMessage(message, type="info"){
  loginMessage.textContent = message;
  loginMessage.className = "login-message " + type;
}

function showSystem(){
  loginOverlay.style.display = "none";
}

function showLogin(){
  loginOverlay.style.display = "grid";
}

async function initAuth(){
  if(!supabaseClient){
    setLoginMessage("Cole a Publishable Key do Supabase neste arquivo antes de testar o login.","error");
    return;
  }

  const {data, error} = await supabaseClient.auth.getSession();

  if(error){
    console.error(error);
    setLoginMessage("Não foi possível verificar a sessão.","error");
    return;
  }

  if(data.session){
    showSystem();
  }else{
    showLogin();
  }

  supabaseClient.auth.onAuthStateChange((_event, session)=>{
    if(session) showSystem();
    else showLogin();
  });
}

loginForm.addEventListener("submit", async (event)=>{
  event.preventDefault();

  if(!supabaseClient){
    setLoginMessage("Falta configurar a Publishable Key do Supabase.","error");
    return;
  }

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  setLoginMessage("Entrando...","info");

  const {data, error} = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    console.error(error);
    setLoginMessage(
      "Não foi possível entrar. Confira o e-mail, a senha e se o usuário está confirmado no Supabase.",
      "error"
    );
    return;
  }

  setLoginMessage("Login realizado.","info");
  showSystem();
});

async function logout(){
  if(supabaseClient) await supabaseClient.auth.signOut();
  showLogin();
}


const names=["João da Silva","Maria Souza","Carlos Oliveira","Ana Santos","Pedro Almeida","Lucas Ferreira","Juliana Costa","Marcos Pereira","Fernanda Lima","Rafael Gomes","Bruna Martins","Diego Rodrigues","Camila Barbosa","André Carvalho","Larissa Rocha","Gustavo Mendes","Patrícia Nunes","Eduardo Castro","Renata Alves","Thiago Ribeiro"];
let drivers=Array.from({length:120},(_,i)=>{let status=i<47?["SUCESSO","SUCESSO","SUCESSO","ATENCAO","ERRO","PENDENTE"][i%6]:"PENDENTE";return{id:i+1,nome:names[i%names.length],cpf:"123456789"+String(i+1).padStart(2,"0"),renach:"MT"+String(10000000+i),status,result:status==="SUCESSO"?"CNH encontrada":status==="ATENCAO"?"Conferência necessária":status==="ERRO"?"Erro na consulta":"Aguardando processamento",data:status==="PENDENTE"?"-":"21/09/2026 14:"+(30+i%30),tempo:status==="PENDENTE"?"-":(2+i%5)+"s",tentativas:status==="ERRO"?2:1}});
let page="dashboard", selected=null, paused=false, query="", filter="TODOS";

function mask(c){return"***.***.***-"+c.slice(-2)}
function badge(s){let c={SUCESSO:"success",ATENCAO:"attention",ERRO:"error",PENDENTE:"pending",PROCESSANDO:"processing",CAPTCHA:"captcha",BLOQUEADO:"error"}[s]||"pending";let l={SUCESSO:"Sucesso",ATENCAO:"Atenção",ERRO:"Erro",PENDENTE:"Pendente",PROCESSANDO:"Processando",CAPTCHA:"CAPTCHA",BLOQUEADO:"Bloqueado"}[s];return`<span class="badge ${c}">${l}</span>`}
function header(title,sub){return`<div class="top"><div><h1>${title}</h1><p>${sub}</p></div><div class="top-actions"><span class="system"><i></i>Sistema operacional</span><button class="icon" onclick="toggleTheme()">☾</button><button class="icon" onclick="logout()" title="Sair">↪</button></div></div>`}
function table(data){return`<div class="table-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>RENACH</th><th>Status</th><th>Resultado</th><th>Consulta</th><th>Ações</th></tr></thead><tbody>${data.map(d=>`<tr><td><b>${d.nome}</b></td><td>${mask(d.cpf)}</td><td>${d.renach}</td><td>${badge(d.status)}</td><td>${d.result}</td><td>${d.data}</td><td><button class="view" onclick="openDetails(${d.id})">Ver detalhes</button></td></tr>`).join("")}</tbody></table></div>`}
function stats(){return`<div class="cards">
${card("◉","Total de motoristas","600","Arquivo atual")}
${card("▣","Processados","347","58% do total")}
${card("✓","Conferidos","320","92% dos processados")}
${card("◷","Pendentes","253","Aguardando")}
${card("!","Atenção","18","Revisão manual","yellow")}
${card("×","Erros","9","Necessitam revisão","red")}</div>`}
function card(icon,title,val,small,tone=""){return`<div class="card"><div class="card-icon ${tone}">${icon}</div><div><span>${title}</span><b>${val}</b><small>${small}</small></div></div>`}
function progress(){return`<div class="panel"><div class="panel-head"><div><h2>Processamento atual</h2><p>${paused?"O processamento está pausado.":"Conferência em andamento."}</p></div>${badge(paused?"ATENCAO":"PROCESSANDO")}</div><div class="progress"><div></div></div><div class="progress-row"><b>347 / 600</b><span>58%</span></div><div class="mini"><div><span>Processados</span><b>347</b></div><div><span>Sucesso</span><b class="green">320</b></div><div><span>Atenção</span><b class="yellow">18</b></div><div><span>Erros</span><b class="red">9</b></div><div><span>Pendentes</span><b>253</b></div></div><div class="actions"><button class="btn primary" onclick="pauseResume()">${paused?"▶ Continuar":"Ⅱ Pausar"}</button><button class="btn danger" onclick="paused=true;render()">■ Cancelar</button></div></div>`}

function renderDashboard(){main.innerHTML=header("Dashboard","Visão geral da conferência de motoristas")+stats()+progress()+`<div class="panel"><div class="panel-head"><div><h2>Últimas consultas</h2><p>Atividade recente do processamento.</p></div></div>${table(drivers.slice(0,8))}</div>`}
function renderMotoristas(){let data=drivers.filter(d=>(filter==="TODOS"||d.status===filter)&&(`${d.nome} ${d.cpf} ${d.renach}`).toLowerCase().includes(query.toLowerCase()));main.innerHTML=header("Motoristas","Todos os motoristas importados")+`<div class="toolbar"><div class="search">⌕ <input placeholder="Buscar por nome, CPF ou RENACH..." value="${query}" oninput="query=this.value;render()"></div><select class="select" onchange="filter=this.value;render()"><option value="TODOS">Todos</option><option>PENDENTE</option><option>PROCESSANDO</option><option>SUCESSO</option><option>ATENCAO</option><option>ERRO</option></select></div><div class="panel"><p><b>${data.length}</b> motoristas encontrados</p>${table(data.slice(0,20))}</div>`}
function renderImportar(){main.innerHTML=header("Importar Excel","Adicione a lista de motoristas para conferência")+`<div class="panel"><label class="upload" for="excel"><div class="upload-icon">⇧</div><h3>Importe sua planilha de motoristas</h3><p>Arraste seu arquivo Excel aqui ou clique para selecionar.</p><b>.xlsx · .xls</b><input id="excel" type="file" accept=".xlsx,.xls" onchange="fileChosen(this.files[0])"></label></div>`}
function fileChosen(f){if(!f)return;if(!/\\.(xlsx|xls)$/i.test(f.name)){alert("Selecione um arquivo Excel.");return}main.innerHTML=header("Importar Excel","Prévia e mapeamento da planilha")+`<div class="panel"><div class="file-card"><div>▣</div><div><b>${f.name}</b><small>${(f.size/1024/1024).toFixed(2)} MB · 600 registros encontrados</small></div><b class="check">✓</b></div><div class="mapping"><h2>Mapear colunas</h2><p>Confirme as colunas da sua planilha.</p><label>Nome<select><option>Nome</option><option>Nome completo</option></select></label><label>CPF<select><option>CPF</option></select></label><label>RENACH<select><option>RENACH</option></select></label></div><div class="preview"><h2>Prévia</h2><div class="preview-grid"><b>Nome</b><b>CPF</b><b>RENACH</b>${drivers.slice(0,5).map(d=>`<div class="row"><span>${d.nome}</span><span>${mask(d.cpf)}</span><span>${d.renach}</span></div>`).join("")}</div></div><button class="btn primary" style="margin-top:18px" onclick="alert('Planilha preparada para processamento.')">✓ Confirmar importação</button></div>`}
function renderProcessamento(){main.innerHTML=header("Processamento","Acompanhe a conferência em tempo real")+progress()+`<div class="process-grid"><div class="panel"><div class="eyebrow">MOTORISTA ATUAL</div><h2>João da Silva</h2><div class="fields"><span>CPF<b>***.***.***-00</b></span><span>RENACH<b>MT10000001</b></span></div><div class="processing"><span class="spinner"></span>Consultando dados...</div></div><div class="panel"><div class="eyebrow">AÇÕES</div><button class="btn primary" style="width:100%;justify-content:center" onclick="captcha()">⚠ Simular CAPTCHA</button></div></div><div class="alert">⚠ <p>Se o portal solicitar verificação humana, o processamento deverá ser pausado para intervenção manual.</p></div>`}
function renderResultados(){main.innerHTML=header("Resultados","Resultados da conferência atual")+`<div class="cards" style="grid-template-columns:repeat(3,1fr)">${card("✓","Total","347","Processados")}${card("!","Atenção","18","Revisão manual","yellow")}${card("×","Erros","9","Necessitam revisão","red")}</div><div class="panel"><div class="panel-head"><div><h2>Resultados</h2><p>Resultados registrados.</p></div><div class="actions"><button class="btn primary" onclick="alert('Exportação será conectada ao backend.')">⇩ Excel</button><button class="btn" onclick="alert('Exportação será conectada ao backend.')">⇩ CSV</button></div></div>${table(drivers.filter(d=>d.status!=="PENDENTE").slice(0,15))}</div>`}
function renderLogs(){let logs=[["14:32:10","João Silva","Consulta iniciada","INFO"],["14:32:13","João Silva","Resultado recebido","SUCCESS"],["14:33:01","Maria Souza","Erro","ERROR"],["14:33:25","Carlos Oliveira","Consulta concluída","SUCCESS"],["14:34:02","Ana Santos","Atenção","WARNING"]];main.innerHTML=header("Logs","Histórico das atividades do sistema")+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Horário</th><th>Motorista</th><th>Ação</th><th>Status</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${l[0]}</td><td><b>${l[1]}</b></td><td>${l[2]}</td><td>${badge(l[3]==="SUCCESS"?"SUCESSO":l[3]==="ERROR"?"ERRO":l[3]==="WARNING"?"ATENCAO":"PROCESSANDO")}</td></tr>`).join("")}</tbody></table></div></div>`}
function renderConfig(){main.innerHTML=header("Configurações","Preferências da interface")+`<div class="settings-grid"><div class="panel setting"><h2>Geral</h2><p>Informações do sistema.</p><label>Nome<input value="DETRAN-MT CNH Checker" readonly></label><label>URL do portal<input value="https://www.detran.mt.gov.br/consulte-sua-habilitacao" readonly></label></div><div class="panel setting"><h2>Processamento</h2><p>Preferências para a futura integração.</p><label>Intervalo mínimo<input type="number" value="1500"></label><label>Intervalo máximo<input type="number" value="4000"></label><label>Limite por execução<input type="number" value="600"></label></div></div><button class="btn primary" onclick="alert('Configurações salvas neste navegador.')">✓ Salvar configurações</button>`}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));({dashboard:renderDashboard,motoristas:renderMotoristas,importar:renderImportar,processamento:renderProcessamento,resultados:renderResultados,logs:renderLogs,configuracoes:renderConfig}[page]||renderDashboard)()}
document.getElementById("nav").onclick=e=>{let b=e.target.closest("button");if(!b)return;page=b.dataset.page;render()};
function pauseResume(){paused=!paused;render()}
function openDetails(id){selected=drivers.find(d=>d.id===id);document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><div><h2>Detalhes do motorista</h2><p>Informações da conferência</p></div><button class="close" onclick="document.getElementById('modal').remove()">×</button></div><div class="details"><div><span>Nome</span><b>${selected.nome}</b></div><div><span>CPF</span><b>${mask(selected.cpf)}</b></div><div><span>RENACH</span><b>${selected.renach}</b></div><div><span>Status</span><b>${badge(selected.status)}</b></div><div><span>Resultado</span><b>${selected.result}</b></div><div><span>Data</span><b>${selected.data}</b></div><div><span>Tempo</span><b>${selected.tempo}</b></div><div><span>Tentativas</span><b>${selected.tentativas}</b></div></div><button class="btn primary" style="width:100%;justify-content:center" onclick="document.getElementById('modal').remove()">Fechar</button></div></div>`)}
function captcha(){document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="captchaModal"><div class="modal captcha-box"><div class="captcha-icon">⚠</div><h2>Intervenção necessária</h2><p>O portal solicitou uma verificação humana.</p><div class="alert"><p>Realize a verificação no navegador e depois clique em <b>Continuar</b>.</p></div><div class="modal-actions"><button class="btn" onclick="document.getElementById('captchaModal').remove()">Cancelar</button><button class="btn primary" onclick="document.getElementById('captchaModal').remove()">Continuar</button></div></div></div>`)}
function toggleTheme(){document.body.style.filter=document.body.style.filter?"":"brightness(.92)"}
render();
initAuth();
</script>
</body>
</html>
