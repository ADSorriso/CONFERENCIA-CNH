@keyframes sidebarAurora{
  0%{background-position:50% 100%,100% 10%,0% 100%,50% 50%;transform:translate3d(-2%,1%,0) scale(1.03);filter:saturate(1)}
  25%{background-position:78% 72%,72% 34%,26% 82%,52% 48%;transform:translate3d(1%,-1%,0) scale(1.06);filter:saturate(1.08)}
  50%{background-position:64% 92%,88% 18%,48% 66%,48% 52%;transform:translate3d(3%,1%,0) scale(1.04);filter:saturate(1.12)}
  75%{background-position:36% 70%,62% 42%,18% 92%,54% 49%;transform:translate3d(-1%,-2%,0) scale(1.07);filter:saturate(1.08)}
  100%{background-position:42% 88%,92% 18%,8% 88%,48% 52%;transform:translate3d(-3%,1%,0) scale(1.03);filter:saturate(1)}
}
@keyframes sidebarAuroraGlow{
  0%{opacity:.72;transform:translate3d(-7%,5%,0) scale(1.03) rotate(-1deg)}
  25%{opacity:.95;transform:translate3d(4%,-3%,0) scale(1.07) rotate(.5deg)}
  50%{opacity:.82;transform:translate3d(9%,2%,0) scale(1.04) rotate(1deg)}
  75%{opacity:1;transform:translate3d(-2%,-4%,0) scale(1.08) rotate(-.5deg)}
  100%{opacity:.76;transform:translate3d(-8%,3%,0) scale(1.03) rotate(-1deg)}
}
/* SIDEBAR — gradiente aurora suave, igual à referência criada */
.sidebar{
  width:240px;top:0;left:10px;bottom:12px;right:auto;
  padding:20px 15px 18px;border-radius:0 0 25px 25px;overflow:hidden;isolation:isolate;
  background:#06163c;color:#fff;box-shadow:8px 0 22px rgba(0,35,92,.18);
}
.sidebar:before{
  content:"";position:absolute;inset:-10%;pointer-events:none;z-index:0;
  background:
    radial-gradient(75% 36% at 101% 16%,rgba(0,214,255,.94) 0%,rgba(0,143,255,.70) 24%,rgba(0,78,215,.22) 48%,transparent 72%),
    radial-gradient(86% 30% at 35% 74%,rgba(0,199,255,.96) 0%,rgba(0,116,255,.78) 24%,rgba(0,56,190,.32) 49%,transparent 73%),
    radial-gradient(78% 25% at 8% 88%,rgba(103,25,255,.92) 0%,rgba(37,56,221,.62) 27%,rgba(9,57,194,.20) 51%,transparent 74%),
    linear-gradient(180deg,#071b49 0%,#061743 43%,#061b49 100%);
  background-size:130% 115%,145% 125%,125% 115%,100% 100%;
  background-position:50% 100%,100% 10%,0% 100%,50% 50%;
  animation:sidebarAurora 8s ease-in-out infinite;
  will-change:background-position,filter;
}
.sidebar:after{
  content:"";position:absolute;inset:-12%;pointer-events:none;z-index:0;
  background:
    radial-gradient(54% 16% at 31% 70%,rgba(42,224,255,.72) 0%,rgba(0,155,255,.48) 35%,transparent 72%),
    radial-gradient(58% 15% at 54% 63%,rgba(34,113,255,.58) 0%,rgba(39,70,238,.30) 37%,transparent 72%),
    radial-gradient(45% 12% at 5% 87%,rgba(107,25,255,.65) 0%,rgba(72,38,235,.32) 36%,transparent 74%),
    radial-gradient(44% 28% at 102% 22%,rgba(0,205,255,.46) 0%,rgba(0,101,230,.24) 36%,transparent 73%);
  background-size:140% 140%,135% 135%,130% 130%,125% 125%;
  background-position:20% 75%,60% 62%,0% 90%,100% 20%;
  mix-blend-mode:screen;
  filter:blur(16px);
  opacity:.88;
  animation:sidebarAuroraGlow 6s ease-in-out infinite;
  will-change:transform,opacity;
}
.sidebar>*{position:relative;z-index:1}
.sidebar .brand{height:64px;padding:0 4px;gap:14px;align-items:center;margin-bottom:14px}

function renderExecucoes(){
  const executions=drivers.filter(d=>d.data_consulta);
  const normDate=v=>v?new Date(v):null;
  const start=execStart?new Date(execStart+'T00:00:00'):null;
  const end=execEnd?new Date(execEnd+'T23:59:59'):null;
  let data=executions.filter(d=>{
    const status=statusKey(d.status), dt=normDate(d.data_consulta);
    const matchesQuery=norm(`${d.nome||''} ${d.cpf||''} ${d.renach||''}`).includes(norm(execQuery));
    const matchesStatus=execStatus==='TODOS'||status===execStatus;
    const matchesStart=!start||!dt||dt>=start;
    const matchesEnd=!end||!dt||dt<=end;
    return matchesQuery&&matchesStatus&&matchesStart&&matchesEnd;
  }).sort((a,b)=>new Date(b.data_consulta)-new Date(a.data_consulta));
  const total=executions.length,suc=executions.filter(d=>statusKey(d.status)==='sucesso').length,att=executions.filter(d=>statusKey(d.status)==='atencao').length,err=executions.filter(d=>statusKey(d.status)==='erro').length;
  const pages=Math.max(1,Math.ceil(data.length/execPageSize)); if(execPage>pages)execPage=pages;
  const shown=data.slice((execPage-1)*execPageSize,execPage*execPageSize);

  for(let i=1;i<=pages;i++){if(i<=3||i===pages)pag+=`<button class="page-btn ${i===execPage?'active':''}" onclick="execPage=${i};render()">${i}</button>`;else if(i===4&&pages>5)pag+=`<button class="page-btn" disabled>…</button>`;}
  const pct=(n)=>total?((n/total)*100).toFixed(1).replace('.',',')+'% do total':'';
  const icon=(type)=>({file:`<svg viewBox="0 0 32 32" fill="none"><path d="M8 4h10l6 6v18H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" fill="currentColor"/><path d="M18 4v7h6" fill="none" stroke="#dff0ff" stroke-width="2"/><path d="M11 16h10M11 20h10M11 24h7" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`,check:`<svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" fill="currentColor"/><path d="m10 16 4 4 8-9" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,alert:`<svg viewBox="0 0 32 32" fill="none"><path d="M16 4 29 27H3L16 4Z" fill="currentColor"/><path d="M16 11v8M16 23v.5" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>`,error:`<svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" fill="currentColor"/><path d="m11 11 10 10M21 11 11 21" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>`}[type]);

      <div class="exec-stat"><div class="exec-stat-icon success">${icon('check')}</div><div><span class="exec-stat-label">Sucesso</span><b class="exec-stat-value">${suc}</b><span class="exec-stat-sub">${pct(suc)}</span></div></div>
      <div class="exec-stat"><div class="exec-stat-icon attention">${icon('alert')}</div><div><span class="exec-stat-label">Atenção</span><b class="exec-stat-value">${att}</b><span class="exec-stat-sub">${pct(att)}</span></div></div>

      <div class="exec-pagination"><span>Mostrando ${shown.length?((execPage-1)*execPageSize+1):0} a ${Math.min(execPage*execPageSize,data.length)} de ${data.length} resultados</span><div class="exec-pages"><button class="page-btn" onclick="execPage=Math.max(1,execPage-1);render()">‹</button>${pag}<button class="page-btn" onclick="execPage=Math.min(${pages},execPage+1);render()">›</button></div></div>

<script id="sidebar-wave-motion">
(function(){
  function startSidebarWaves(){
    const box=document.querySelector('.sidebar-waves');
    if(!box) return;
    const waves=[
      {el:box.querySelector('.wave-back'), duration:15000, phase:0, lift:1.5},
      {el:box.querySelector('.wave-front'), duration:9000, phase:.22, lift:2.2}
    ].filter(w=>w.el);
    let start=performance.now();
    function frame(now){
      const width=box.clientWidth;
      if(width>0){
        const elapsed=now-start;
        waves.forEach(w=>{
          const p=((elapsed % w.duration)/w.duration + w.phase)%1;
          const x=-(p*width);
          const y=Math.sin(p*Math.PI*2)*w.lift;
          w.el.style.transform=`translate3d(${x}px,${y}px,0)`;
        });
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',startSidebarWaves);
  else startSidebarWaves();
})();
</script>
