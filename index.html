<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CNH CHECKER — DETRAN-MT</title>
<style>
:root{
  --navy:#07183d;--navy2:#0b2555;--blue:#1763d1;--blue2:#2f7bea;

  --red:#e34848;--redbg:#ffebeb;--shadow:0 10px 30px rgba(17,48,95,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}
.sidebar{width:238px;background:linear-gradient(180deg,#07183d,#0b2555);color:#dce8ff;padding:18px 12px;position:fixed;inset:0 auto 0 0;z-index:10}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 27px}
.brand-icon{width:38px;height:38px;border-radius:12px;background:#1464d8;display:grid;place-items:center;color:#fff;font-size:21px;font-weight:900;box-shadow:0 6px 16px #0003}
.brand b{display:block;color:#fff;font-size:14px;letter-spacing:.2px}.brand small{color:#8fa9d4;font-size:10px}
.nav{display:grid;gap:6px}.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:12px;border-radius:10px;background:transparent;color:#aebfdf;text-align:left;font-weight:700;font-size:13px}
.nav button:hover,.nav button.active{background:linear-gradient(90deg,#1955a9,#1e67cb);color:#fff;box-shadow:0 5px 15px #0002}

.side-bottom{position:absolute;bottom:18px;left:25px;font-size:10px;color:#91a9d0}.dot{display:inline-block;width:7px;height:7px;background:#35d18a;border-radius:50%;margin-right:6px;box-shadow:0 0 0 3px #35d18a22}
main{margin-left:238px;width:calc(100% - 238px);padding:18px 28px 35px;max-width:1700px}
.topbar{height:52px;display:flex;align-items:center;gap:15px;margin-bottom:17px}
.global-search{height:38px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 13px;flex:1;color:#6d7b92;box-shadow:0 2px 7px #15386706}
.global-search input{border:0;outline:0;width:100%;font-size:12px;background:transparent;color:var(--text)}
.top-right{display:flex;align-items:center;gap:9px}.top-icon{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;color:#334d76}
.user{height:38px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700}
.avatar{width:26px;height:26px;border-radius:50%;background:#102d66;color:#fff;display:grid;place-items:center;font-size:10px}
.top-title{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 0 18px}
.top-title h1{margin:0;font-size:27px;letter-spacing:-.5px}.top-title p{margin:5px 0 0;color:var(--muted);font-size:12px}
.datebox{font-size:11px;color:#65758f;text-align:right}.datebox b{display:block;color:#263d63}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 15px;display:flex;gap:11px;align-items:center;box-shadow:var(--shadow)}
.card-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:#eaf2ff;color:#2164c0;font-size:18px;flex:0 0 auto}
.card-icon.green{background:var(--greenbg);color:var(--green)}.card-icon.yellow{background:var(--yellowbg);color:var(--yellow)}.card-icon.red{background:var(--redbg);color:var(--red)}
.card span{display:block;color:#77869d;font-size:9px}.card b{display:block;font-size:21px;margin-top:2px}.card small{color:#9aa6b8;font-size:8px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:var(--shadow);margin-bottom:18px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px}.panel h2{margin:0;font-size:16px}.panel p{margin:4px 0;color:var(--muted);font-size:11px}
.progress-main{display:grid;grid-template-columns:1fr 210px;gap:18px;align-items:center}.progress{height:11px;background:#e8eef6;border-radius:99px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#1555b5,#2e82ed);border-radius:99px;transition:.3s}
.progress-row{display:flex;justify-content:space-between;margin-top:7px;color:#687891;font-size:11px}.progress-cta{height:54px;border-radius:10px;background:#1655ad;color:#fff;font-weight:800;font-size:12px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:17px}.mini div{background:#f7f9fc;border-radius:9px;padding:10px}.mini span{display:block;font-size:9px;color:#7d899b}.mini b{font-size:15px}
.green-text{color:var(--green)!important}.yellow-text{color:var(--yellow)!important}.red-text{color:var(--red)!important}
.lower-grid{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:13px}.simple-list{display:grid;gap:8px}.simple-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:5px 0;color:#52627b}.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}.recent-empty{text-align:center;padding:28px 10px;color:#8793a7;font-size:11px}.quote{margin-top:13px;color:#657692;font-size:10px;font-style:italic}
.tip{display:flex;gap:8px;align-items:flex-start;font-size:10px;color:#52627b}.tip+.tip{margin-top:10px}.check{color:#16a765;font-weight:900}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;min-width:880px}th,td{padding:10px 11px;border-bottom:1px solid #edf1f6;text-align:left;font-size:10px;white-space:nowrap}th{background:#fafbfd;color:#738198;text-transform:uppercase;font-size:8px;letter-spacing:.5px}td{color:#4f607a}tr:last-child td{border-bottom:0}
.view{background:#eaf2ff;color:#1758ad;border-radius:7px;padding:6px 9px;font-size:9px;font-weight:800}.menu-dot{font-size:16px;color:#74839b}
.toolbar{display:flex;gap:9px;margin-bottom:13px}.search{background:#fff;border:1px solid var(--line);border-radius:9px;height:39px;display:flex;align-items:center;padding:0 11px;flex:1;max-width:510px}.search input{border:0;outline:0;width:100%;font-size:11px}.select{height:39px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 10px;color:#59677d;font-size:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 13px;border-radius:9px;background:#edf1f6;color:#35435a;font-size:11px;font-weight:800}.btn.primary{background:#1758b4;color:#fff}.btn.success{background:var(--greenbg);color:#108b54}.btn.warning{background:var(--yellowbg);color:#996900}.btn.danger{background:var(--redbg);color:#c13f3f}.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar-right{margin-left:auto}.toolbar-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.found{font-size:10px;color:#74839a}.pagination{display:flex;justify-content:flex-end;gap:5px;margin-top:12px}.page-btn{min-width:29px;height:29px;border:1px solid var(--line);background:#fff;border-radius:7px;color:#51637e;font-size:10px}.page-btn.active{background:#1758b4;color:#fff;border-color:#1758b4}
.process-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:17px}.process-main{position:relative}.process-main:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;background:#1bc27a;border-radius:4px}.current{padding-left:14px}.eyebrow{font-size:8px;font-weight:900;letter-spacing:1.2px;color:#8492a7}.current h2{font-size:20px;margin:4px 0 14px}.fields{display:flex;gap:60px}.fields span{font-size:10px;color:#7a8798}.fields b{display:block;color:#2c3c53;margin-top:4px;font-size:12px}
.det-card{background:linear-gradient(135deg,#f7fbff,#edf5ff);border:1px solid #dbe9fb;border-radius:12px;padding:15px;margin-top:16px}.det-card h3{margin:0 0 5px;font-size:14px}.det-card p{font-size:10px}.copy-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.copy-chip{background:#fff;border:1px solid #dfe7f2;border-radius:8px;padding:8px 10px;font-size:10px;color:#40516b}.copy-chip b{color:#17233a}.hint{margin-top:10px;padding:9px;border-radius:8px;background:#fff7e8;color:#8b6100;font-size:9px}
.open-detran{width:100%;height:43px;background:#1256b9;color:#fff;border-radius:9px;font-size:11px;font-weight:900;margin-top:11px}.result-buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:15px}.result-buttons button{min-height:55px}.result-buttons small{display:block;font-size:8px;font-weight:600;margin-top:3px}
.steps{display:grid;gap:10px;margin-top:8px}.step{display:flex;gap:9px;align-items:center;font-size:10px;color:#586b88}.step-num{width:20px;height:20px;border-radius:50%;background:#1758b4;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:900;flex:0 0 auto}
.badge{display:inline-block;border-radius:99px;padding:5px 8px;font-size:8px;font-weight:900}.success-badge{background:var(--greenbg);color:#138b54}.attention-badge{background:var(--yellowbg);color:#9a7000}.error-badge{background:var(--redbg);color:#c53d3d}.pending-badge{background:#edf0f4;color:#657184}.processing-badge{background:#e8f1ff;color:#1e5eb6}
.empty{padding:35px;text-align:center;color:#778398}
.modal-bg{position:fixed;inset:0;background:#061126aa;backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:16px;padding:22px;width:min(650px,100%);box-shadow:0 25px 70px #0004}.modal-head{display:flex;justify-content:space-between}.modal-head h2{margin:0}.close{background:#eef1f5;width:34px;height:34px;border-radius:8px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.details div{background:#f7f9fc;padding:11px;border-radius:9px}.details span{display:block;font-size:9px;color:#7b8799}.details b{display:block;font-size:12px;margin-top:4px}
.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#07183d,#174e9d);display:grid;place-items:center;padding:20px;z-index:9999}.login-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 25px 80px #0005}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.login-brand-icon{width:46px;height:46px;border-radius:13px;background:#1763d1;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}.login-brand b{display:block;font-size:17px}.login-brand small{color:#71809a}.login-card h1{margin:0 0 7px;font-size:23px}.login-card p{color:#778398;font-size:13px}.login-field{margin-top:16px}.login-field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.login-field input{width:100%;height:44px;border:1px solid #dfe5ed;border-radius:9px;padding:0 12px;outline:0}.login-btn{width:100%;height:44px;margin-top:20px;border-radius:9px;background:#17458f;color:#fff;font-weight:800}.login-message{margin-top:13px;padding:11px;border-radius:9px;font-size:12px;display:none}.login-message.error{display:block;background:#fff0f0;color:#b93636}.login-message.info{display:block;background:#eef6ff;color:#205b9e}
.toast{position:fixed;right:20px;bottom:20px;background:#12213e;color:#fff;padding:12px 15px;border-radius:10px;font-size:12px;z-index:50;box-shadow:0 10px 30px #0003}.toast.error{background:#a62d2d}
@media(max-width:1150px){.cards{grid-template-columns:repeat(3,1fr)}.lower-grid{grid-template-columns:1fr 1fr}.lower-grid>div:last-child{grid-column:1/-1}}
@media(max-width:850px){.sidebar{width:70px}.sidebar .brand div:last-child,.nav button span,.side-bottom{display:none}.nav button{justify-content:center}.brand{justify-content:center}.sidebar{padding:15px 8px}main{margin-left:70px;width:calc(100% - 70px);padding:15px}.process-grid{grid-template-columns:1fr}.progress-main{grid-template-columns:1fr}.progress-cta{width:100%}}
@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.lower-grid{grid-template-columns:1fr}.lower-grid>div:last-child{grid-column:auto}.topbar{height:auto}.global-search{display:none}.top-title{align-items:flex-start}.datebox{display:none}.mini{grid-template-columns:1fr 1fr}.toolbar{flex-direction:column}.search{max-width:none}.fields{gap:25px}.result-buttons{grid-template-columns:1fr}.user{display:none}}
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-brand"><div class="login-brand-icon">✓</div><div><b>CNH CHECKER</b><small>DETRAN-MT</small></div></div>
    <h1>Acesso restrito</h1><p>Entre com seu usuário para acessar o sistema.</p>
    <form id="loginForm">
      <div class="login-field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username" required placeholder="seu@email.com"></div>
      <div class="login-field"><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
      <button class="login-btn" type="submit">Entrar</button>
    </form>
    <div id="loginMessage" class="login-message"></div>
    <p style="text-align:center;font-size:10px;margin-top:18px">Acesso protegido por Supabase Auth</p>
  </div>
</div>

<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-icon">✓</div><div><b>CNH CHECKER</b><small>DETRAN-MT</small></div></div>
  <div class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="nav-ico">▦</span><span>Dashboard</span></button>
    <button data-page="motoristas"><span class="nav-ico">♙</span><span>Motoristas</span></button>
    <button data-page="processamento"><span class="nav-ico">◉</span><span>Processamento</span></button>
  </div>
  <div class="side-bottom"><span class="dot"></span>Sistema online<br><span style="margin-left:13px;color:#6682ad">Supabase conectado</span></div>
</aside>
<main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://antkqvrbcebqucqdkmau.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Xc2Y7koEBU-BCGwsgMPDiw_ObyBXQ-I";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const DETRAN_URL="https://www.detran.mt.gov.br/consulte-sua-habilitacao";

const loginOverlay=document.getElementById('loginOverlay'),loginForm=document.getElementById('loginForm'),loginMessage=document.getElementById('loginMessage'),main=document.getElementById('main');
let page='dashboard',drivers=[],selected=null,query='',filter='TODOS',loading=false,currentPage=1;
const PAGE_SIZE=10;

function msg(t,error=false){const e=document.createElement('div');e.className='toast'+(error?' error':'');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function setLogin(t,type='info'){loginMessage.textContent=t;loginMessage.className='login-message '+type}
function showSystem(){loginOverlay.style.display='none'} function showLogin(){loginOverlay.style.display='grid'}
async function initAuth(){const {data,error}=await supabaseClient.auth.getSession();if(error){setLogin('Erro ao verificar sessão.','error');return}if(data.session)showSystem();else showLogin();supabaseClient.auth.onAuthStateChange((_e,s)=>s?showSystem():showLogin())}
loginForm.addEventListener('submit',async e=>{e.preventDefault();setLogin('Entrando...','info');const {error}=await supabaseClient.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(error){setLogin('E-mail ou senha inválidos.','error');return}showSystem();await loadDrivers();render()});
async function logout(){await supabaseClient.auth.signOut();showLogin()}
function maskCPF(cpf){const s=String(cpf||'').replace(/\D/g,'');return s.length>=11?s.slice(0,3)+'.***.***-'+s.slice(-2):s||'—'}
function fullCPF(cpf){const s=String(cpf||'').replace(/\D/g,'');return s.length===11?s.slice(0,3)+'.'+s.slice(3,6)+'.'+s.slice(6,9)+'-'+s.slice(9):String(cpf||'—')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function statusKey(s){return String(s||'pendente').toLowerCase()}
function badge(s){const k=statusKey(s),map={sucesso:['success-badge','Sucesso'],atencao:['attention-badge','Atenção'],erro:['error-badge','Erro'],pendente:['pending-badge','Pendente'],processando:['processing-badge','Processando']};const [c,l]=map[k]||map.pendente;return `<span class="badge ${c}">${l}</span>`}
function topbar(){return `<div class="topbar"><div class="global-search">⌕<input placeholder="Conferência de motoristas do DETRAN-MT" onkeydown="if(event.key==='Enter'){page='motoristas';query=this.value;currentPage=1;render()}"></div><div class="top-right"><button class="top-icon" title="Notificações">♧</button><div class="user"><span class="avatar">AD</span><span>Administrador</span>⌄</div></div></div>`}
function header(title,sub,withDate=false){return topbar()+`<div class="top-title"><div><h1>${title}</h1><p>${sub}</p></div>${withDate?`<div class="datebox"><b>21 de setembro de 2026</b>20:34</div>`:''}</div>`}
async function loadDrivers(){loading=true;const {data,error}=await supabaseClient.from('motoristas').select('*').order('criado_em',{ascending:true});loading=false;if(error){msg('Não foi possível carregar os motoristas.',true);console.error(error);return}drivers=data||[]}
function counts(){const c={total:drivers.length,pend:0,proc:0,suc:0,att:0,err:0};drivers.forEach(d=>{const s=statusKey(d.status);if(s==='pendente')c.pend++;else if(s==='processando')c.proc++;else if(s==='sucesso')c.suc++;else if(s==='atencao')c.att++;else if(s==='erro')c.err++});c.done=c.suc+c.att+c.err;return c}
function card(icon,title,val,small,tone=''){return `<div class="card"><div class="card-icon ${tone}">${icon}</div><div><span>${title}</span><b>${val}</b><small>${small}</small></div></div>`}
function stats(){const c=counts();return `<div class="cards">${card('◉','Total de motoristas',c.total,'Base atual')}${card('✓','Sucesso',c.suc,'Consultas concluídas','green')}${card('!','Atenção',c.att,'Revisão manual','yellow')}${card('×','Erros',c.err,'Necessitam revisão','red')}${card('◷','Pendentes',c.pend,'Aguardando consulta')}</div>`}
function progress(){const c=counts(),pct=c.total?Math.round(c.done/c.total*100):0;return `<div class="panel"><div class="panel-head"><div><h2>Progresso da conferência</h2><p>Organize a fila e acompanhe as consultas realizadas no DETRAN-MT.</p></div></div><div class="progress-main"><div><div class="progress"><div style="width:${pct}%"></div></div><div class="progress-row"><b>${c.done} de ${c.total} motoristas processados</b><span>${pct}%</span></div></div><button class="progress-cta" onclick="page='processamento';selected=null;render()">▶ Iniciar processamento<br><small style="font-size:8px;font-weight:500">Consultar motoristas no DETRAN-MT</small></button></div><div class="mini"><div><span>Concluídos</span><b>${c.done}</b></div><div><span>Sucesso</span><b class="green-text">${c.suc}</b></div><div><span>Atenção</span><b class="yellow-text">${c.att}</b></div><div><span>Pendentes</span><b>${c.pend}</b></div></div></div>`}
function dashboardLower(){const c=counts();return `<div class="lower-grid"><div class="panel"><div class="panel-head"><h2>Status atual</h2></div><div class="simple-list"><div class="simple-row"><span><i class="status-dot" style="background:#16a765"></i>Concluídos</span><b>${c.done}</b></div><div class="simple-row"><span><i class="status-dot" style="background:#2d72d6"></i>Em processamento</span><b>${c.proc}</b></div><div class="simple-row"><span><i class="status-dot" style="background:#b8c2d0"></i>Pendentes</span><b>${c.pend}</b></div><div class="simple-row"><span><i class="status-dot" style="background:#e5a11b"></i>Atenção</span><b>${c.att}</b></div><div class="simple-row"><span><i class="status-dot" style="background:#e34848"></i>Erros</span><b>${c.err}</b></div></div></div><div class="panel"><div class="panel-head"><h2>♧ Atividade recente</h2></div><div class="recent-empty">◷<br><br>Nenhuma consulta realizada ainda.<br><small>As consultas aparecerão aqui em tempo real.</small></div></div><div class="panel"><div class="panel-head"><h2>💡 Dicas</h2></div><div class="tip"><span class="check">✓</span>Mantenha sua conexão estável</div><div class="tip"><span class="check">✓</span>Use o processamento assistido</div><div class="tip"><span class="check">✓</span>Verifique os resultados com atenção</div><div class="tip"><span class="check">✓</span>Em caso de erro, revise manualmente</div><div class="quote">“Informação hoje, um trânsito mais seguro amanhã.”</div></div></div>`}
function table(data){return `<div class="table-wrap"><table><thead><tr><th>#</th><th>Nome</th><th>CPF</th><th>RENACH</th><th>Status</th><th>Resultado</th><th>Consulta</th><th>Ações</th></tr></thead><tbody>${data.map((d,i)=>`<tr><td>${i+1}</td><td><b>${esc(d.nome)}</b></td><td>${maskCPF(d.cpf)}</td><td>${esc(d.renach||'—')}</td><td>${badge(d.status)}</td><td>${esc(d.resultado||'—')}</td><td>${d.data_consulta?new Date(d.data_consulta).toLocaleString('pt-BR'):'—'}</td><td><button class="view" onclick="openDetails('${d.id}')">Ver detalhes</button> <span class="menu-dot">⋮</span></td></tr>`).join('')||`<tr><td colspan="8" class="empty">Nenhum motorista encontrado.</td></tr>`}</tbody></table></div>`}
function renderDashboard(){main.innerHTML=header('Dashboard','Visão geral da conferência de motoristas',true)+stats()+progress()+dashboardLower()}
function renderMotoristas(){let data=drivers.filter(d=>(filter==='TODOS'||statusKey(d.status)===filter)&&norm(`${d.nome} ${d.cpf} ${d.renach}`).includes(norm(query)));const pages=Math.max(1,Math.ceil(data.length/PAGE_SIZE));if(currentPage>pages)currentPage=pages;const shown=data.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);let pag='';for(let i=1;i<=pages;i++){if(i<=5||i===pages)pag+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="currentPage=${i};render()">${i}</button>`}main.innerHTML=header('Motoristas','Motoristas carregados no Supabase')+`<div class="toolbar"><div class="search">⌕ <input placeholder="Buscar por nome, CPF ou RENACH..." value="${esc(query)}" oninput="query=this.value;currentPage=1;render()"></div><select class="select" onchange="filter=this.value;currentPage=1;render()"><option value="TODOS">Todos os status</option><option value="pendente">Pendente</option><option value="processando">Processando</option><option value="sucesso">Sucesso</option><option value="atencao">Atenção</option><option value="erro">Erro</option></select><div class="found">${data.length} motoristas encontrados</div></div><div class="panel"><div class="toolbar-title"><h2>Lista de motoristas</h2><span class="found">Página ${currentPage} de ${pages}</span></div>${table(shown)}<div class="pagination"><button class="page-btn" onclick="currentPage=Math.max(1,currentPage-1);render()">‹</button>${pag}<button class="page-btn" onclick="currentPage=Math.min(${pages},currentPage+1);render()">›</button></div></div>`}
function nextPending(){return drivers.find(d=>['pendente','processando'].includes(statusKey(d.status)))||null}
function currentDriver(){if(selected)return selected;return nextPending()}
function renderProcessamento(){const d=currentDriver();if(!d){main.innerHTML=header('Processamento','Faça a consulta no portal oficial e registre o resultado')+`<div class="panel empty"><h2>Fila concluída 🎉</h2><p>Não há motoristas pendentes para consulta.</p></div>`;return}selected=d;const c=counts();main.innerHTML=header('Processamento','Faça a consulta no portal oficial e registre o resultado')+`<div class="panel"><div class="panel-head"><div><h2>Fila de consulta</h2><p>${c.done} de ${c.total} concluídos</p></div><div>${badge(d.status)}</div></div><div class="progress"><div style="width:${c.total?Math.round(c.done/c.total*100):0}%"></div></div></div><div class="process-grid"><div class="panel process-main"><div class="current"><div class="eyebrow">MOTORISTA ATUAL</div><h2>${esc(d.nome)}</h2><div class="fields"><span>CPF<b>${maskCPF(d.cpf)}</b></span><span>RENACH<b>${esc(d.renach||'—')}</b></span></div><div class="det-card"><h3>↗ Consultar no DETRAN-MT</h3><p>Abra a página oficial “Consulte sua Habilitação” em uma nova aba.</p><div class="copy-row"><button class="copy-chip" onclick="copyText('${esc(d.cpf)}','CPF copiado')">▣ CPF <b>${maskCPF(d.cpf)}</b></button><button class="copy-chip" onclick="copyText('${esc(d.renach||'')}','RENACH copiado')">▣ RENACH <b>${esc(d.renach||'—')}</b></button><button class="copy-chip" onclick="copyBoth()">▣ Copiar os dois</button></div><button class="open-detran" onclick="openDetran()">↗ Abrir DETRAN-MT</button><div class="hint">Depois da consulta, volte para esta aba e registre o resultado. O reCAPTCHA continua sendo feito normalmente no portal.</div></div></div><div class="result-buttons"><button class="btn success" onclick="finishDriver('sucesso')">✓ Sucesso<small>Consulta realizada com sucesso</small></button><button class="btn warning" onclick="finishDriver('atencao')">⚠ Atenção<small>Necessita revisão manual</small></button><button class="btn danger" onclick="finishDriver('erro')">× Erro<small>Problema na consulta</small></button></div></div><div class="panel"><div class="eyebrow">COMO FUNCIONA?</div><h2>Consulta assistida</h2><div class="steps"><div class="step"><span class="step-num">1</span>Abra o site do DETRAN-MT</div><div class="step"><span class="step-num">2</span>Preencha o CPF e o RENACH</div><div class="step"><span class="step-num">3</span>Resolva o reCAPTCHA</div><div class="step"><span class="step-num">4</span>Clique em Consultar</div><div class="step"><span class="step-num">5</span>Volte aqui e registre o resultado</div></div><hr style="border:0;border-top:1px solid #edf0f4;margin:18px 0"><button class="btn" style="width:100%" onclick="openDetails('${d.id}')">▣ Ver detalhes do motorista</button></div></div>`}
async function copyText(value,label){try{await navigator.clipboard.writeText(String(value||''));msg(label)}catch{msg('Não foi possível copiar automaticamente.',true)}}
async function copyBoth(){const d=currentDriver();if(!d)return;await copyText(`CPF: ${d.cpf}\nRENACH: ${d.renach||''}`,'CPF + RENACH copiados')}
function openDetran(){const d=currentDriver();if(!d)return;copyBoth();window.open(DETRAN_URL,'_blank','noopener,noreferrer');msg('DETRAN aberto. CPF + RENACH foram copiados.')}
async function finishDriver(status){const d=currentDriver();if(!d)return;const label=status==='sucesso'?'CNH consultada no DETRAN':status==='atencao'?'Conferência manual necessária':'Erro na consulta';const {error}=await supabaseClient.from('motoristas').update({status,resultado:label,data_consulta:new Date().toISOString()}).eq('id',d.id);if(error){console.error(error);msg('Não foi possível salvar o resultado.',true);return}await loadDrivers();selected=null;msg('Resultado salvo. Próximo motorista carregado.');render()}
function openDetails(id){const d=drivers.find(x=>String(x.id)===String(id));if(!d)return;document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><div><h2>Detalhes do motorista</h2><p>Dados armazenados no sistema.</p></div><button class="close" onclick="document.getElementById('modal').remove()">×</button></div><div class="details"><div><span>Nome</span><b>${esc(d.nome)}</b></div><div><span>CPF</span><b>${esc(fullCPF(d.cpf))}</b></div><div><span>RENACH</span><b>${esc(d.renach||'—')}</b></div><div><span>Status</span><b>${badge(d.status)}</b></div><div><span>Resultado</span><b>${esc(d.resultado||'—')}</b></div><div><span>Consulta</span><b>${d.data_consulta?new Date(d.data_consulta).toLocaleString('pt-BR'):'—'}</b></div></div><div class="actions" style="display:flex;gap:8px"><button class="btn primary" style="flex:1" onclick="document.getElementById('modal').remove();selected=drivers.find(x=>x.id==='${d.id}');page='processamento';render()">Consultar este motorista</button><button class="btn" onclick="document.getElementById('modal').remove()">Fechar</button></div></div></div>`)}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({dashboard:renderDashboard,motoristas:renderMotoristas,processamento:renderProcessamento}[page]||renderDashboard)()}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;page=b.dataset.page;render()}
supabaseClient.auth.getSession().then(({data})=>{if(data.session){showSystem();loadDrivers().then(render)}else showLogin()});
</script>
</body>
</html>
